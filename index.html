<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>EXTREME Disney - Log System</title>
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --deep-space: #020617; --panel-bg: rgba(15, 23, 42, 0.95); }
        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--deep-space) 100%);
            color: #e0faff; font-family: 'Noto Sans JP', sans-serif;
            margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        .neon-text { text-shadow: 0 0 10px var(--neon-blue); }
        
        main { flex: 0 0 auto; }
        #timeline-wrapper { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        #timeline-wrapper::-webkit-scrollbar { display: none; }

        .rect-btn {
            height: 54px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 4px 10px; line-height: 1.3; font-weight: bold;
        }

        .category-icon { width: 24px; height: 24px; margin-bottom: 4px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        @keyframes pulse-slow { 0%, 100% { border-color: rgba(0,242,255,0.2); } 50% { border-color: rgba(0,242,255,1); } }
        .recording-active { animation: pulse-slow 2s infinite; border-width: 2px; }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30">
        <div>
            <h1 class="tomorrow-font text-base neon-text tracking-widest font-bold italic">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font">SECTOR: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400">RESET</button>
            <button onclick="openExportModal()" class="px-2 py-2 rounded-lg border border-cyan-700 bg-cyan-950/40 text-[8px] tomorrow-font">EXPORT</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-cyan-400 text-[9px] font-bold tomorrow-font bg-cyan-900/50">IN PARK</button>
        </div>
    </header>

    <div id="recording-overlay" class="mx-4 mt-2 hidden">
        <div class="glass-panel neon-border rounded-2xl p-4 flex justify-between items-center recording-active">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-ping"></div>
                <div class="max-w-[150px]">
                    <h3 id="active-name" class="font-bold text-xs truncate uppercase">---</h3>
                    <p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p>
                </div>
            </div>
            <button onclick="stopRecording()" class="bg-cyan-500 text-black font-bold py-2 px-6 rounded-xl shadow-[0_0_15px_rgba(0,242,255,0.5)] text-sm uppercase">Finish</button>
        </div>
    </div>

    <main class="p-4 space-y-4">
        <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
            <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all bg-cyan-500 text-black">TOKYO DISNEY LAND</button>
            <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all text-slate-400">TOKYO DISNEY SEA</button>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <button onclick="openCategory('attraction')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">ATTRACTION</span>
            </button>
            <button onclick="openCategory('show')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">SHOW</span>
            </button>
            <button onclick="openCategory('greeting')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">GREETING</span>
            </button>
            <button onclick="openCategory('food')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">FOOD</span>
            </button>
            <button onclick="openCategory('shop')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">SHOP</span>
            </button>
            <button onclick="openCategory('rest')" class="glass-panel p-3 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
                <span class="tomorrow-font text-[8px] text-cyan-400">REST</span>
            </button>
        </div>
    </main>

    <div id="timeline-wrapper" class="px-4 border-t border-cyan-500/20 glass-panel rounded-t-[2rem]">
        <div class="flex justify-between items-center py-4 sticky top-0 bg-slate-950/80 backdrop-blur-md z-10">
            <h2 class="tomorrow-font text-[9px] text-cyan-400 tracking-[0.3em] font-bold uppercase">Mission Log Timeline</h2>
            <span id="log-count" class="text-[9px] text-slate-500 tomorrow-font">0 RECORDS</span>
        </div>
        <div id="timeline-list" class="space-y-2 pb-10">
            <div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for data...</p></div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col items-center justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modal-container" class="glass-panel neon-border w-full rounded-t-[2.5rem] p-6 relative z-[110] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">

                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-lg">×</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

        let currentPark = 'TDL';
        let currentRecord = null;
        let timerInterval = null;
        let history = [];
        let isInPark = false;

        function switchPark(park) {
            currentPark = park;
            const isTDL = park === 'TDL';
            document.getElementById('btn-TDL').className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition-all ${isTDL?'bg-cyan-500 text-black':'text-slate-400'}`;
            document.getElementById('btn-TDS').className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition-all ${!isTDL?'bg-cyan-500 text-black':'text-slate-400'}`;
            document.getElementById('current-park-display').innerText = `SECTOR: ${park}`;
        }

        function toggleParkInOut() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            isInPark = !isInPark;
            const btn = document.getElementById('park-status-btn');
            
            if (isInPark) {
                btn.innerText = "OUT PARK";
                btn.classList.add('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.remove('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimeline(`インパーク (${currentPark})`, timeStr, "START");
            } else {
                btn.innerText = "IN PARK";
                btn.classList.remove('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.add('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimeline(`アウトパーク (${currentPark})`, timeStr, "END");
            }
        }

        function openCategory(type) {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = `${type.toUpperCase()} - TARGET SELECT`;
            content.innerHTML = '';

            const filtered = masterData.filter(d => d.park === currentPark && d.type === type);
            const groups = filtered.reduce((a, o) => { (a[o.area] = a[o.area] || []).push(o); return a; }, {});

            for (const area in groups) {
                const areaDiv = document.createElement('div');
                areaDiv.className = "mb-4";
                areaDiv.innerHTML = `<h3 class="text-[8px] font-bold text-slate-500 mb-2 tomorrow-font tracking-widest uppercase">>>> ${area}</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2";
                
                groups[area].forEach(spot => {
                    const btn = document.createElement('button');
                    btn.className = "glass-panel rounded-xl border border-slate-800 text-white active:bg-cyan-900 rect-btn";
                    btn.innerText = spot.name;
                    btn.onclick = () => { startRecording(spot); closeModal(); };
                    grid.appendChild(btn);
                });
                areaDiv.appendChild(grid);
                content.appendChild(areaDiv);
            }
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        function startRecording(spot) {
            if (currentRecord) stopRecording();
            currentRecord = { ...spot, startTime: new Date() };
            document.getElementById('active-name').innerText = spot.name;
            document.getElementById('recording-overlay').classList.remove('hidden');
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateActiveTimer, 1000);
            updateActiveTimer();
        }

        function updateActiveTimer() {
            if(!currentRecord) return;
            const diff = Math.floor((new Date() - currentRecord.startTime) / 1000);
            const h = String(Math.floor(diff/3600)).padStart(2, '0');
            const m = String(Math.floor((diff%3600)/60)).padStart(2, '0');
            const s = String(diff%60).padStart(2, '0');
            document.getElementById('active-timer').innerText = `${h}:${m}:${s}`;
        }

        function stopRecording() {
            if (!currentRecord) return;
            const end = new Date();
            const durSec = Math.floor((end - currentRecord.startTime) / 1000);
            const startStr = currentRecord.startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const durStr = `${Math.floor(durSec/60)}m ${durSec%60}s`;
            addTimeline(currentRecord.name, startStr, durStr);
            clearInterval(timerInterval);
            currentRecord = null;
            document.getElementById('recording-overlay').classList.add('hidden');
        }

        function addTimeline(name, start, duration) {
            history.push({ name, start, duration });
            renderTimeline();
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">No Mission Logs</p></div>';
            } else {
                history.forEach((h, index) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center glass-panel p-3 rounded-xl border-l-2 border-cyan-400 slide-in";
                    div.innerHTML = `
                        <div class="flex-1">
                            <p class="text-[10px] font-bold">${h.name}</p>
                            <p class="tomorrow-font text-[7px] text-slate-500 uppercase">T-MARK: ${h.start}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <p class="tomorrow-font text-[9px] text-cyan-400 font-bold">${h.duration}</p>
                            <button onclick="deleteLog(${index})" class="w-6 h-6 rounded bg-red-950/30 text-red-500 text-xs border border-red-900/50 flex items-center justify-center">×</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
            document.getElementById('log-count').innerText = `${history.length} RECORDS`;
            const wrapper = document.getElementById('timeline-wrapper');
            wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
        }

        function deleteLog(i) {
            if(confirm("MISSION CANCEL - DELETE LOG?")) { history.splice(i, 1); renderTimeline(); }
        }

        function resetAllLogs() {
            if(confirm("SYSTEM RESET - DELETE ALL MISSION LOGS?")) { history = []; renderTimeline(); }
        }

        function openExportModal() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPORT LOG DATA";
            let logText = history.map(h => `${h.start} | ${h.name} (${h.duration})`).join('\n');
            content.innerHTML = `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
                    <pre id="raw-log" class="text-[9px] font-mono leading-relaxed whitespace-pre-wrap text-cyan-100">${logText || 'Empty'}</pre>
                </div>
                <button onclick="copyLog()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-[10px] tomorrow-font uppercase">Copy to Clipboard</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        async function copyLog() {
            await navigator.clipboard.writeText(document.getElementById('raw-log').innerText);
            alert("Mission Log Saved to Clipboard.");
        }

        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }
    </script>
