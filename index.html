<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>EXTREME Disney</title>
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --deep-space: #020617; --panel-bg: rgba(15, 23, 42, 0.95); }
        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--deep-space) 100%);
            color: #e0faff; font-family: 'Noto Sans JP', sans-serif;
            margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        .neon-text { text-shadow: 0 0 10px var(--neon-blue); }
        
        main { flex: 0 0 auto; }
        
        #timeline-wrapper { 
            flex: 1 1 auto; 
            height: 380px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        #timeline-wrapper::-webkit-scrollbar { display: none; }

        .rect-btn {
            height: 54px; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 4px 10px; line-height: 1.3; font-weight: bold; gap: 2px;
        }

        .category-icon { width: 22px; height: 22px; margin-bottom: 2px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        
        .cost-display-bar {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 12px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
        }

        @keyframes pulse-slow { 0%, 100% { border-color: rgba(0,242,255,0.2); } 50% { border-color: rgba(0,242,255,1); } }
        .recording-active { animation: pulse-slow 2s infinite; border-width: 2px; }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30">
        <div>
            <h1 class="tomorrow-font text-base neon-text tracking-widest font-bold italic">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font uppercase">Sector: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400 uppercase">Reset</button>
            <button onclick="openExportModal()" class="px-2 py-2 rounded-lg border border-cyan-700 bg-cyan-950/40 text-[8px] tomorrow-font uppercase">Export</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-cyan-400 text-[9px] font-bold tomorrow-font bg-cyan-900/50 uppercase">In Park</button>
        </div>
    </header>

    <div id="recording-overlay" class="mx-4 mt-2 hidden">
        <div class="glass-panel neon-border rounded-2xl p-4 flex justify-between items-center recording-active">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-ping"></div>
                <div class="max-w-[150px]">
                    <h3 id="active-name" class="font-bold text-xs truncate uppercase">---</h3>
                    <p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p>
                </div>
            </div>
            <button onclick="stopRecording()" class="bg-cyan-500 text-black font-bold py-2 px-6 rounded-xl text-sm">FINISH</button>
        </div>
    </div>

    <main class="p-4 space-y-3">
        <div class="space-y-2">
            <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
                <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all bg-cyan-500 text-black uppercase">Land</button>
                <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all text-slate-400 uppercase">Sea</button>
            </div>
            <div class="cost-display-bar" onclick="openCostHistory()">
                <span class="tomorrow-font text-[9px] text-yellow-500 tracking-widest font-bold">TOTAL EXPENSES</span>
                <span id="cost-display-value" class="tomorrow-font text-base text-yellow-400 neon-text font-bold">¥0</span>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <button onclick="openCategory('attraction')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Attr</span>
            </button>
            <button onclick="openCategory('show')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Show</span>
            </button>
            <button onclick="openCategory('greeting')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Greet</span>
            </button>
            <button onclick="openCategory('dpa')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2v20m10-10H2"></path></svg>
                <span class="tomorrow-font text-[7px] text-red-400 font-bold uppercase">Dpa</span>
            </button>
            <button onclick="openCategory('food')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Food</span>
            </button>
            <button onclick="openCategory('shop')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Shop</span>
            </button>
            <button onclick="openCategory('rest')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Rest</span>
            </button>
            <button onclick="openCalculator()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 1v22M17 5H7M17 19H7M17 12H7"></path></svg>
                <span class="tomorrow-font text-[7px] text-yellow-400 uppercase">Cost</span>
            </button>
        </div>
    </main>

    <div id="timeline-wrapper" class="px-4 border-t border-cyan-500/20 glass-panel rounded-t-[2rem]">
        <div class="flex justify-between items-center py-4 sticky top-0 bg-slate-950/80 backdrop-blur-md z-10">
            <h2 class="tomorrow-font text-[9px] text-cyan-400 tracking-[0.3em] font-bold uppercase">Mission Timeline</h2>
            <span id="log-count" class="text-[9px] text-slate-500 tomorrow-font uppercase tracking-widest">0 Logged</span>
        </div>
        <div id="timeline-list" class="space-y-2 pb-10">
            <div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col items-center justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modal-container" class="glass-panel neon-border w-full rounded-t-[2.5rem] p-6 relative z-[110] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="tomorrow-font text-cyan-400 font-bold tracking-widest text-xs uppercase">Select target</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-lg">×</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

        let currentPark = 'TDL';

        function switchPark(park) {
            currentPark = park;
            const isTDL = park === 'TDL';
            document.getElementById('btn-TDL').className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition-all ${isTDL?'bg-cyan-500 text-black':'text-slate-400'}`;

            document.getElementById('current-park-display').innerText = `SECTOR: ${park}`;
        }

        function toggleParkInOut() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            isInPark = !isInPark;
            const btn = document.getElementById('park-status-btn');
            if (isInPark) {
                btn.innerText = "OUT PARK";
                btn.classList.add('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.remove('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimeline(`インパーク (${currentPark})`, timeStr, "---");
            } else {
                btn.innerText = "IN PARK";
                btn.classList.remove('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.add('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimeline(`アウトパーク (${currentPark})`, timeStr, "---");
            }
        }

        function openCategory(type) {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = `${type.toUpperCase()} SELECT`;
            content.innerHTML = '';
            
            const filtered = masterData.filter(d => d.park === currentPark && d.type === type);
            const groups = filtered.reduce((a, o) => { (a[o.area] = a[o.area] || []).push(o); return a; }, {});
            
            for (const area in groups) {
                const areaDiv = document.createElement('div');
                areaDiv.className = "mb-4";
                areaDiv.innerHTML = `<h3 class="text-[8px] font-bold text-slate-500 mb-2 tomorrow-font tracking-widest uppercase">>>> ${area}</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2";
                
                groups[area].forEach(spot => {
                    const btn = document.createElement('button');
                    btn.className = "glass-panel rounded-xl border border-slate-800 text-white active:bg-cyan-900 rect-btn";
                    btn.innerHTML = `<span>${spot.name}</span>${spot.price ? `<span class="text-[9px] text-yellow-400">¥${spot.price}</span>` : ''}`;
                    btn.onclick = () => { 
                        if(spot.type === 'dpa') {
                            addCost(spot.name, spot.price);
                            addTimeline(`購入: ${spot.name}`, new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), `¥${spot.price}`);
                        } else {
                            startRecording(spot);
                        }
                        closeModal(); 
                    };
                    grid.appendChild(btn);
                });
                areaDiv.appendChild(grid);
                content.appendChild(areaDiv);
            }
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        function startRecording(spot) {
            if (currentRecord) stopRecording();
            currentRecord = { ...spot, startTime: new Date() };
            document.getElementById('active-name').innerText = spot.name;
            document.getElementById('recording-overlay').classList.remove('hidden');
            if(timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                const diff = Math.floor((new Date() - currentRecord.startTime) / 1000);
                const h = String(Math.floor(diff/3600)).padStart(2, '0');
                const m = String(Math.floor((diff%3600)/60)).padStart(2, '0');
                const s = String(diff%60).padStart(2, '0');
                document.getElementById('active-timer').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function stopRecording() {
            if (!currentRecord) return;
            const end = new Date();
            const durSec = Math.floor((end - currentRecord.startTime) / 1000);
            const startStr = currentRecord.startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const durStr = `${Math.floor(durSec/60)}m ${durSec%60}s`;
            addTimeline(currentRecord.name, startStr, durStr);
            clearInterval(timerId);
            currentRecord = null;
            document.getElementById('recording-overlay').classList.add('hidden');
        }

        function addTimeline(name, start, duration) {
            history.push({ name, start, duration });
            renderTimeline();
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            history.forEach((h, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center glass-panel p-3 rounded-xl border-l-2 border-cyan-400";
                div.innerHTML = `<div class="flex-1"><p class="text-[10px] font-bold">${h.name}</p><p class="tomorrow-font text-[7px] text-slate-500">T-MARK: ${h.start}</p></div><div class="flex items-center gap-3"><p class="tomorrow-font text-[9px] text-cyan-400 font-bold">${h.duration}</p><button onclick="deleteLog(${index})" class="w-6 h-6 rounded bg-red-950/30 text-red-500 text-xs flex items-center justify-center">×</button></div>`;
                list.appendChild(div);
            });
            document.getElementById('log-count').innerText = `${history.length} LOGS`;
            document.getElementById('timeline-wrapper').scrollTo({ top: 9999, behavior: 'smooth' });
        }

        function deleteLog(i) { history.splice(i, 1); renderTimeline(); }
        function resetAllLogs() { if(confirm("RESET ALL?")) { history=[]; costHistory=[]; totalCost=0; document.getElementById('cost-display-value').innerText="¥0"; renderTimeline(); } }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

        function openCalculator() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "COST ADD";
            content.innerHTML = `<div class="space-y-4"><div><label class="text-[10px] text-cyan-400">ITEM NAME</label><input id="calc-name" type="text" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-cyan-400"></div><div><label class="text-[10px] text-cyan-400">AMOUNT (¥)</label><input id="calc-amount" type="number" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400"></div><button onclick="addCostFromCalc()" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl">ADD EXPENSE</button></div>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        function addCostFromCalc() {
            const name = document.getElementById('calc-name').value || "Others";
            const amount = parseInt(document.getElementById('calc-amount').value) || 0;
            if(amount > 0) addCost(name, amount);
            closeModal();
        }
        function addCost(name, amount) {
            costHistory.push({ name, amount, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
            totalCost += amount;
            document.getElementById('cost-display-value').innerText = `¥${totalCost.toLocaleString()}`;
        }
        function openCostHistory() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPENSE BREAKDOWN";
            let listHtml = costHistory.map((c, i) => `<div class="flex justify-between p-3 border-b border-slate-800 text-xs"><span>${c.name}</span><span class="text-yellow-400 font-bold">¥${c.amount.toLocaleString()}</span></div>`).join('');
            content.innerHTML = `<div class="space-y-1 mb-4">${listHtml || 'No data'}</div><button onclick="copyCostLog()" class="w-full bg-cyan-500 text-black py-3 rounded-xl uppercase text-[10px] tomorrow-font">Copy Cost List</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        async function copyCostLog() {
            let text = costHistory.map(c => `${c.time} | ${c.name} : ¥${c.amount}`).join('\n') + `\nTOTAL: ¥${totalCost}`;
            await navigator.clipboard.writeText(text); alert("Cost list copied!");
        }
        async function openExportModal() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPORT ALL";
            let logText = history.map(h => `${h.start} | ${h.name} (${h.duration})`).join('\n') + `\n\n--- COST ---\nTOTAL: ¥${totalCost}`;
            content.innerHTML = `<div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4 text-[9px] font-mono whitespace-pre-wrap">${logText}</div><button onclick="copyLog()" class="w-full bg-cyan-500 text-black py-3 rounded-xl uppercase tomorrow-font">Copy Clipboard</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }
        async function copyLog() { await navigator.clipboard.writeText(history.map(h => `${h.start} | ${h.name} (${h.duration})`).join('\n')); alert("Logs Copied!"); }
