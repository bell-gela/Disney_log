<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EXTREME Disney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --panel-bg: rgba(15, 23, 42, 0.95); }
        body { background-color: #020617; background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 100%); color: #e0faff; font-family: 'Noto Sans JP', sans-serif; margin: 0; height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); overflow: hidden; }
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        #in-park-scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .rect-btn { height: 50px; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; line-height: 1.1; }
        .category-icon { width: 18px; height: 18px; margin-bottom: 2px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        input, select, textarea { font-size: 16px !important; }
        .text-shadow-cyan { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30 shrink-0 z-50">
        <div>
            <h1 class="tomorrow-font text-base text-shadow-cyan tracking-widest font-bold italic text-cyan-300">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font uppercase mt-0.5 opacity-0">Sector: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400">RESET</button>
            <button onclick="openDataModal()" class="px-2 py-2 rounded-lg border border-cyan-700 bg-cyan-950/40 text-[8px] tomorrow-font text-cyan-100">DATA</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-cyan-400 text-[9px] font-bold tomorrow-font bg-cyan-900/50 text-cyan-100 uppercase">Pre-Park</button>
        </div>
    </header>

    <div id="pre-park-dashboard" class="flex-1 overflow-y-auto p-4 space-y-5">
        <div class="glass-panel p-5 rounded-2xl relative border-t-2 border-t-cyan-500">
            <button onclick="openPreParkSettings()" class="absolute top-3 right-3 text-cyan-600">⚙️</button>
            <h2 class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.3em] font-bold uppercase mb-2 text-center">Mission Start</h2>
            <div id="countdown-display" class="tomorrow-font text-3xl text-cyan-300 text-center font-bold">-- DAYS<br><span class="text-xl">--:--:--</span></div>
        </div>
        <div class="glass-panel p-4 rounded-2xl border-l-2 border-l-yellow-500">
            <h2 class="tomorrow-font text-[10px] text-yellow-500 font-bold mb-1">MISSION FUND</h2>
            <div class="flex justify-between items-end mb-2">
                <span id="fund-current" class="tomorrow-font text-2xl text-yellow-400 font-bold">¥0</span>
                <span id="fund-target" class="text-xs text-slate-400">/ ¥0</span>
            </div>
            <div class="h-2 bg-slate-900 rounded-full overflow-hidden mb-4"><div id="fund-progress-bar" class="h-full bg-yellow-500 transition-all" style="width: 0%"></div></div>
            <div class="flex gap-2">
                <select id="fund-input-amount" class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white"></select>
                <button onclick="addFundFromInput()" class="bg-yellow-600 text-black font-bold px-6 rounded-xl text-xs uppercase">Add</button>
            </div>
        </div>
        <div class="space-y-3">
            <h2 class="tomorrow-font text-[10px] text-cyan-400 font-bold ml-1 uppercase">Preparation Log</h2>
            <div class="flex gap-2"><input type="text" id="tweet-input" placeholder="準備メモ..." class="flex-1 bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm text-white"><button onclick="postTweet()" class="bg-cyan-600 text-black font-bold px-4 rounded-xl text-xs">Post</button></div>
            <div id="tweet-list" class="space-y-3 pb-10"></div>
        </div>
    </div>

    <div id="in-park-dashboard" class="hidden flex-1 flex-col overflow-hidden relative">
        <div id="cooldown-container" class="shrink-0 bg-slate-950/80 border-b border-cyan-900/50 p-2 z-40 hidden flex gap-2">
            <div id="dpa-timer-block" class="flex-1 glass-panel p-2 rounded-lg border-l-2 border-red-500 hidden">
                <div class="flex justify-between items-center mb-1"><span class="tomorrow-font text-[8px] text-red-400 font-bold uppercase">DPA Ready</span><span id="dpa-timer-text" class="tomorrow-font text-[10px] text-red-300">--:--</span></div>
                <div class="h-1 bg-slate-800 rounded-full overflow-hidden"><div id="dpa-timer-bar" class="h-full bg-red-500" style="width: 0%"></div></div>
            </div>
            <div id="pp-timer-block" class="flex-1 glass-panel p-2 rounded-lg border-l-2 border-yellow-500 hidden">
                <div class="flex justify-between items-center mb-1"><span class="tomorrow-font text-[8px] text-yellow-500 font-bold uppercase">PP Ready</span><span id="pp-timer-text" class="tomorrow-font text-[10px] text-yellow-300">--:--</span></div>
                <div class="h-1 bg-slate-800 rounded-full overflow-hidden"><div id="pp-timer-bar" class="h-full bg-yellow-500" style="width: 0%"></div></div>
            </div>
        </div>

        <div id="in-park-scroll-area">
            <div id="recording-overlay" class="mx-4 mt-2 hidden glass-panel neon-border rounded-2xl p-4 flex flex-col gap-3 z-30 relative">
                <div class="flex justify-between items-center">
                    <div><h3 id="active-name" class="font-bold text-xs uppercase truncate max-w-[150px]">---</h3><p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p></div>
                    <button onclick="stopRecording()" class="bg-red-600 text-white font-bold py-2 px-6 rounded-xl text-sm uppercase">Finish</button>
                </div>
                <div id="live-cost-input-area" class="hidden flex gap-2 pt-3 border-t border-slate-700">
                    <input type="number" id="live-item-cost" placeholder="Cost" class="flex-1 bg-slate-900 border border-slate-700 p-2 rounded-xl text-white"><button onclick="saveLiveCost()" id="live-cost-save-btn" class="bg-yellow-500 text-black font-bold px-4 rounded-xl text-xs">Save</button>
                </div>
            </div>

            <main class="p-4 space-y-3">
                <div class="space-y-2">
                    <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
                        <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all bg-cyan-500 text-black">Land</button>
                        <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all text-slate-400">Sea</button>
                    </div>
                    <div class="cost-display-bar py-3 relative overflow-hidden" onclick="openCostHistory()">
                        <div id="budget-progress" class="absolute left-0 top-0 bottom-0 bg-cyan-500/30 w-0 transition-all"></div>
                        <div class="relative z-10 flex justify-between w-full px-2">
                            <div class="flex flex-col"><span id="budget-label" class="tomorrow-font text-[10px] text-cyan-400 font-bold">BUDGET: ¥30,000</span><span class="text-[8px] text-slate-400 uppercase">Total Expenses</span></div>
                            <span id="cost-display-value" class="tomorrow-font text-xl text-cyan-300 font-bold">¥0</span>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-5 gap-1.5">
                    <button onclick="openCategory('attraction')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Attr</span></button>
                    <button onclick="openCategory('show')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Show</span></button>
                    <button onclick="openCategory('greeting')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Greet</span></button>
                    <button onclick="openCategory('pass')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M12 2v20m10-10H2"></path></svg><span class="tomorrow-font text-[7px] text-red-400 font-bold uppercase">Pass</span></button>
                    <button onclick="openStatusMenu()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon stroke-green-400"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg><span class="tomorrow-font text-[7px] text-green-400 uppercase">Status</span></button>
                    <button onclick="openCategory('food')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Food</span></button>
                    <button onclick="openCategory('shop')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Shop</span></button>
                    <button onclick="openCategory('rest')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M3 12h18M3 6h18M3 18h18"></path></svg><span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Rest</span></button>
                    <button onclick="openCalculator()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><svg class="category-icon"><path d="M12 1v22M17 5H7M17 19H7M17 12H7"></path></svg><span class="tomorrow-font text-[7px] text-yellow-400 font-bold uppercase">Cost</span></button>
                    <button onclick="openDailyMemoModal()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center"><span class="text-xs">✎</span><span class="tomorrow-font text-[7px] text-cyan-100 uppercase">Notes</span></button>
                </div>
            </main>

            <div id="timeline-wrapper" class="border-t border-cyan-500/20 glass-panel rounded-t-[2rem] flex flex-col mt-2 min-h-[400px]">
                <div onclick="openFullTimeline()" class="shrink-0 p-5 flex justify-between items-center sticky top-0 bg-slate-950/90 backdrop-blur-xl border-b border-cyan-900/30 rounded-t-[2rem]">
                    <h2 class="tomorrow-font text-xs text-cyan-400 font-bold uppercase">Mission Timeline 🔍</h2>
                    <span id="log-count" class="text-[10px] text-slate-500 tomorrow-font">0 Logged</span>
                </div>
                <div id="timeline-list" class="space-y-2 p-4 pb-32"></div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modal-container" class="glass-panel neon-border w-full rounded-t-[2.5rem] p-6 relative z-[110] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6"><h2 id="modal-title" class="tomorrow-font text-cyan-400 font-bold text-xs uppercase">SELECT</h2><button onclick="closeModal()" class="text-2xl w-8 h-8 flex items-center justify-center bg-slate-800 rounded-full">×</button></div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const masterData = [
            // TDL
            { park:'TDL', type:'attraction', area:'アドベンチャー', name:'カリブの海賊' },
            { park:'TDL', type:'attraction', area:'アドベンチャー', name:'ジャングルクルーズ' },
            { park:'TDL', type:'attraction', area:'ウエスタン', name:'ビッグサンダー・マウンテン' },
            { park:'TDL', type:'attraction', area:'クリッター', name:'スプラッシュ・マウンテン' },
            { park:'TDL', type:'attraction', area:'ファンタジー', name:'美女と野獣“魔法のものがたり”' },
            { park:'TDL', type:'attraction', area:'ファンタジー', name:'プーさんのハニーハント' },
            { park:'TDL', type:'attraction', area:'ファンタジー', name:'ホーンテッドマンション' },
            { park:'TDL', type:'attraction', area:'ファンタジー', name:'ピーターパン空の旅' },
            { park:'TDL', type:'attraction', area:'トゥモロー', name:'ベイマックスのハッピーライド' },
            { park:'TDL', type:'attraction', area:'トゥモロー', name:'スター・ツアーズ' },
            { park:'TDL', type:'attraction', area:'トゥモロー', name:'モンスターズ・インク' },
            { park:'TDL', type:'show', area:'ショー', name:'ハーモニー・イン・カラー' },
            { park:'TDL', type:'show', area:'ショー', name:'エレパレ' },
            { park:'TDL', type:'show', area:'ショー', name:'Reach for the Stars' },
            { park:'TDL', type:'pass', area:'DPA(有料)', name:'美女と野獣 (DPA)', price:2000, passType:'dpa' },
            { park:'TDL', type:'pass', area:'DPA(有料)', name:'ベイマックス (DPA)', price:1500, passType:'dpa' },
            { park:'TDL', type:'pass', area:'PP(無料)', name:'ホーンテッド (PP)', passType:'pp' },
            { park:'TDL', type:'pass', area:'PP(無料)', name:'プーさん (PP)', passType:'pp' },
            { park:'TDL', type:'pass', area:'PP(無料)', name:'モンスターズ (PP)', passType:'pp' },
            { park:'TDL', type:'pass', area:'PP(無料)', name:'スターツアーズ (PP)', passType:'pp' },
            // TDS
            { park:'TDS', type:'attraction', area:'ハーバー', name:'ソアリン' },
            { park:'TDS', type:'attraction', area:'アメフロ', name:'トイ・ストーリー・マニア！' },
            { park:'TDS', type:'attraction', area:'アメフロ', name:'タワー・オブ・テラー' },
            { park:'TDS', type:'attraction', area:'ミステリアス', name:'センター・オブ・ジ・アース' },
            { park:'TDS', type:'attraction', area:'ロストリバー', name:'インディ・ジョーンズ' },
            { park:'TDS', type:'attraction', area:'ロストリバー', name:'レイジングスピリッツ' },
            { park:'TDS', type:'attraction', area:'FS', name:'アナとエルサのフローズンジャーニー' },
            { park:'TDS', type:'attraction', area:'FS', name:'ラプンツェルのランタンフェスティバル' },
            { park:'TDS', type:'attraction', area:'FS', name:'ピーターパンのネバーランド' },
            { park:'TDS', type:'show', area:'ショー', name:'ビリーヴ！' },
            { park:'TDS', type:'pass', area:'DPA(有料)', name:'ソアリン (DPA)', price:2000, passType:'dpa' },
            { park:'TDS', type:'pass', area:'DPA(有料)', name:'トイマニ (DPA)', price:2000, passType:'dpa' },
            { park:'TDS', type:'pass', area:'DPA(有料)', name:'アナ雪 (DPA)', price:2000, passType:'dpa' },
            { park:'TDS', type:'pass', area:'PP(無料)', name:'インディ (PP)', passType:'pp' },
            { park:'TDS', type:'pass', area:'PP(無料)', name:'レイジング (PP)', passType:'pp' },
            { park:'TDS', type:'pass', area:'PP(無料)', name:'マジックランプ (PP)', passType:'pp' }
        ];

        let currentPark='TDL', history=[], costHistory=[], totalCost=0, budget=30000, dailyMemo="", isInPark=false, currentRecord=null, timerId=null;
        let targetDateStr="2026-06-01T08:00:00", targetFund=100000, currentFund=0, lastAddedFund=0, preParkTweets=[];
        let dpaCooldownTime=null, ppCooldownTime=null, sortableTimeline=null;

        const haptic = p => navigator.vibrate && navigator.vibrate(p);
        const getCurrentTime = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

        function saveData(){ const d={history,costHistory,totalCost,budget,dailyMemo,isInPark,targetDateStr,targetFund,currentFund,preParkTweets,dpaCooldownTime:dpaCooldownTime?dpaCooldownTime.getTime():null,ppCooldownTime:ppCooldownTime?ppCooldownTime.getTime():null}; localStorage.setItem('extremeDisneyData',JSON.stringify(d)); }

        function toggleParkInOut(){ haptic([15,40,15]); isInPark=!isInPark; applyModeUI(); addTimelineHistory(isInPark?`インパーク (${currentPark})`:`アウトパーク (${currentPark})`,getCurrentTime(),getCurrentTime(),'---','info'); saveData(); }

        function applyModeUI(){
            const btn=document.getElementById('park-status-btn');
            document.getElementById('pre-park-dashboard').classList.toggle('hidden',isInPark);
            document.getElementById('in-park-dashboard').classList.toggle('hidden',!isInPark);
            document.getElementById('current-park-display').classList.toggle('opacity-0',!isInPark);
            btn.innerText=isInPark?"OUT PARK":"IN PARK";
        }

        function startCooldown(type){
            const now=new Date();
            if(type==='dpa') dpaCooldownTime=new Date(now.getTime()+60*60000);
            if(type==='pp') ppCooldownTime=new Date(now.getTime()+120*60000);
            saveData(); updateCooldownDisplay();
        }

        function updateCooldownDisplay(){
            const now=new Date(); let any=false;
            const db=document.getElementById('dpa-timer-block'), pb=document.getElementById('pp-timer-block');
            if(dpaCooldownTime && dpaCooldownTime > now){
                any=true; db.classList.remove('hidden'); const diff=dpaCooldownTime-now;
                document.getElementById('dpa-timer-text').innerText=`${Math.floor(diff/60000)}:${String(Math.floor((diff%60000)/1000)).padStart(2,'0')}`;
                document.getElementById('dpa-timer-bar').style.width=`${(diff/3600000)*100}%`;
            } else { db.classList.add('hidden'); dpaCooldownTime=null; }
            if(ppCooldownTime && ppCooldownTime > now){
                any=true; pb.classList.remove('hidden'); const diff=ppCooldownTime-now;
                document.getElementById('pp-timer-text').innerText=`${Math.floor(diff/60000)}:${String(Math.floor((diff%60000)/1000)).padStart(2,'0')}`;
                document.getElementById('pp-timer-bar').style.width=`${(diff/7200000)*100}%`;
            } else { pb.classList.add('hidden'); ppCooldownTime=null; }
            document.getElementById('cooldown-container').classList.toggle('hidden',!any);
        }

        function markPassUsed(id,type){ haptic(30); const log=history.find(h=>h.id===id); if(log){ log.passUsed=true; if(type==='dpa') dpaCooldownTime=null; if(type==='pp') ppCooldownTime=null; saveData(); renderTimeline(); updateCooldownDisplay(); } }

        function openCategory(type){
            haptic(10); const content=document.getElementById('modal-content'); document.getElementById('modal-title').innerText=type.toUpperCase(); content.innerHTML='';
            const filtered=masterData.filter(d=>d.park===currentPark && d.type===type);
            const groups=filtered.reduce((a,o)=>{(a[o.area]=a[o.area]||[]).push(o);return a;},{});
            for(const area in groups){
                const div=document.createElement('div'); div.innerHTML=`<h3 class="text-[8px] text-slate-500 mb-2 uppercase">>>> ${area}</h3>`;
                const grid=document.createElement('div'); grid.className="grid grid-cols-2 gap-2 mb-4";
                groups[area].forEach(spot=>{
                    const held=spot.passType==='dpa' && history.some(h=>h.name.includes(spot.name) && !h.passUsed);
                    const btn=document.createElement('button'); btn.className=`glass-panel rounded-xl text-white rect-btn p-2 ${held?'opacity-20':''}`; btn.disabled=held;
                    btn.innerHTML=`<span>${spot.name}</span>${spot.price?`<span class="text-yellow-400">¥${spot.price}</span>`:''}`;
                    btn.onclick=()=>{ closeModal(); haptic(15); if(spot.passType){ const time=getCurrentTime(); const log=addTimelineHistory(`取得: ${spot.name}`,time,time,spot.price?`¥${spot.price}`:'---',spot.price?'cost':'info'); log.passType=spot.passType; log.passUsed=false; if(spot.price) addCost(spot.name,spot.price,time); startCooldown(spot.passType==='pp'?'pp':'dpa'); } else { startRecording(spot); } };
                    grid.appendChild(btn);
                });
                div.appendChild(grid); content.appendChild(div);
            }
            document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').classList.add('flex');
        }

        function startRecording(spot){
            haptic(20); if(currentRecord) stopRecording(); const now=new Date(), time=getCurrentTime();
            currentRecord={...spot, startTimeObj:now}; document.getElementById('active-name').innerText=spot.name; document.getElementById('recording-overlay').classList.remove('hidden');
            const la=document.getElementById('live-cost-input-area'); if(spot.type==='shop'||spot.type==='food'){ la.classList.remove('hidden'); la.classList.add('flex'); document.getElementById('live-item-cost').value=''; document.getElementById('live-cost-save-btn').innerText='Save'; document.getElementById('live-cost-save-btn').disabled=false; } else { la.classList.add('hidden'); }
            currentRecord.tlRef=addTimelineHistory(spot.name,time,'---','00:00:00','active');
            if(timerId) clearInterval(timerId); timerId=setInterval(updateActiveTimer,1000);
        }

        function stopRecording(){
            if(!currentRecord) return; haptic(30); const diff=Math.floor((new Date()-currentRecord.startTimeObj)/1000);
            let dur=`${Math.floor(diff/60)}m ${diff%60}s`; if(currentRecord.savedCost) dur+=` / ¥${currentRecord.savedCost}`;
            currentRecord.tlRef.end=getCurrentTime(); currentRecord.tlRef.duration=dur; currentRecord.tlRef.status='finished';
            saveData(); clearInterval(timerId); currentRecord=null; document.getElementById('recording-overlay').classList.add('hidden'); renderTimeline();
        }

        function updateActiveTimer(){
            if(!currentRecord) return; const diff=Math.floor((new Date()-currentRecord.startTimeObj)/1000);
            const h=String(Math.floor(diff/3600)).padStart(2,'0'), m=String(Math.floor((diff%3600)/60)).padStart(2,'0'), s=String(diff%60).padStart(2,'0');
            let f=`${h}:${m}:${s}`; if(currentRecord.savedCost) f+=` / ¥${currentRecord.savedCost}`;
            document.getElementById('active-timer').innerText=f; const tl=document.getElementById(`duration-${currentRecord.tlRef.id}`); if(tl) tl.innerText=f;
        }

        function addTimelineHistory(name,start,end,duration,status){ const log={id:Date.now(),name,start,end,duration,status,memo:'',passType:null,passUsed:false}; history.push(log); saveData(); renderTimeline(true); return log; }

        function renderTimeline(scroll=false){
            const list=document.getElementById('timeline-list'); list.innerHTML='';
            history.forEach((h,i)=>{
                const div=document.createElement('div'); div.className="flex justify-between items-start glass-panel p-3 rounded-xl border-l-2 border-cyan-400 mb-2";
                let ub=(h.passType && !h.passUsed)?`<button onclick="markPassUsed(${h.id},'${h.passType}')" class="mt-2 bg-cyan-900 border border-cyan-500 text-[8px] px-2 py-1 rounded font-bold uppercase">Mark Used</button>`:"";
                div.innerHTML=`<div class="flex-1 pr-2"><p class="text-sm font-bold text-white">${h.name}</p><p class="text-[10px] text-slate-400 tomorrow-font">${h.start}〜${h.end}</p>${ub}<input type="text" value="${h.memo}" onchange="history[${i}].memo=this.value;saveData();" class="bg-transparent border-b border-slate-700 w-full mt-1 text-[10px] outline-none" style="font-size:10px !important;"></div><div class="flex flex-col items-end"><button onclick="deleteLog(${i})" class="text-red-500 text-xs mb-1">×</button><span class="text-xs text-cyan-400 font-bold" id="duration-${h.id}">${h.duration}</span></div>`;
                list.appendChild(div);
            });
            document.getElementById('log-count').innerText=`${history.length} LOGS`;
            if(scroll){ const w=document.getElementById('in-park-scroll-area'); w.scrollTo({top:w.scrollHeight, behavior:'smooth'}); }
        }

        function deleteLog(i){ if(confirm("Delete?")){ history.splice(i,1); saveData(); renderTimeline(); } }
        function addCost(n,a,t){ costHistory.push({name:n,amount:a,time:t}); totalCost+=a; updateCostDisplay(); saveData(); }
        function updateCostDisplay(){ const r=totalCost/budget; document.getElementById('budget-progress').style.width=`${Math.min(r*100,100)}%`; document.getElementById('cost-display-value').innerText=`¥${totalCost.toLocaleString()}`; }
        function switchPark(p){ haptic(10); currentPark=p; document.getElementById('btn-TDL').className=`flex-1 py-3 rounded-lg text-xs font-bold transition-all ${p==='TDL'?'bg-cyan-500 text-black':'text-slate-400'}`; document.getElementById('btn-TDS').className=`flex-1 py-3 rounded-lg text-xs font-bold transition-all ${p==='TDS'?'bg-cyan-500 text-black':'text-slate-400'}`; document.getElementById('current-park-display').innerText=`Sector: ${p}`; }
        function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }

        // --- Data Management & Exports ---
        async function copyMarkdownLog(){
            let md=`# EXTREME Disney Log\n\n## Notes\n${dailyMemo||'None'}\n\n`;
            history.forEach(h=>{ md+=`## ${h.start} ${h.name}\n\n* **記録**: ${h.duration}\n\n[画像挿入位置]\n\n${h.memo||''}\n\n---\n\n`; });
            md+=`\n**TOTAL: ¥${totalCost}**`; await navigator.clipboard.writeText(md); alert("Markdown Copied!");
        }
        function openDataModal(){
            const content=document.getElementById('modal-content'); document.getElementById('modal-title').innerText="DATA MANAGEMENT";
            content.innerHTML=`<div class="space-y-3"><button onclick="copyMarkdownLog()" class="w-full bg-indigo-900 border border-indigo-500 p-3 rounded-xl text-xs font-bold uppercase">Copy Markdown (Blog)</button><button onclick="copyTextLog()" class="w-full bg-cyan-900 border border-cyan-500 p-3 rounded-xl text-xs font-bold uppercase">Copy Text Log</button><textarea id="json-area" class="w-full bg-slate-900 border border-slate-700 p-2 text-[9px] rounded-xl" rows="4"></textarea><div class="flex gap-2"><button onclick="generateJson()" class="flex-1 bg-slate-700 p-3 rounded-xl text-xs font-bold">EXPORT</button><button onclick="importJson()" class="flex-1 bg-red-900/50 p-3 rounded-xl text-xs font-bold">IMPORT</button></div></div>`;
            document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').classList.add('flex');
        }
        function generateJson(){ const d={history,costHistory,totalCost,budget,dailyMemo,currentFund,targetFund,preParkTweets}; const j=JSON.stringify(d); document.getElementById('json-area').value=j; navigator.clipboard.writeText(j); alert("JSON Copied!"); }
        function importJson(){ try{ const d=JSON.parse(document.getElementById('json-area').value); if(confirm("Overwrite?")){ localStorage.setItem('extremeDisneyData',JSON.stringify(d)); location.reload(); } }catch(e){alert("Invalid JSON");} }

        // --- Pre-Park Specifics ---
        function initFundSelect(){ const s=document.getElementById('fund-input-amount'); for(let i=1000;i<=50000;i+=1000){ let o=document.createElement('option'); o.value=i; o.text=`¥${i.toLocaleString()}`; s.add(o); } }
        function addFundFromInput(){ haptic(15); const v=parseInt(document.getElementById('fund-input-amount').value); if(v){ lastAddedFund=v; currentFund+=v; updatePreParkFundDisplay(); saveData(); } }
        function updatePreParkFundDisplay(){ document.getElementById('fund-current').innerText=`¥${currentFund.toLocaleString()}`; document.getElementById('fund-target').innerText=`/ ¥${targetFund.toLocaleString()}`; const r=targetFund>0?Math.min(currentFund/targetFund*100,100):0; document.getElementById('fund-progress-bar').style.width=`${r}%`; }
        function postTweet(){ const i=document.getElementById('tweet-input'); if(!i.value)return; preParkTweets.unshift({time:getCurrentTime(),text:i.value}); i.value=''; saveData(); renderTweets(); }
        function renderTweets(){ const l=document.getElementById('tweet-list'); l.innerHTML=preParkTweets.map(t=>`<div class="glass-panel p-3 rounded-xl border border-slate-800"><p class="text-[9px] text-cyan-600 font-bold">${t.time}</p><p class="text-sm text-white">${t.text}</p></div>`).join('')||'<div class="text-center text-[9px] text-slate-600">No logs.</div>'; }
        function updateCountdown(){ const n=new Date(), t=new Date(targetDateStr), d=t-n; if(d<=0){ document.getElementById('countdown-display').innerHTML="READY"; return; } const days=Math.floor(d/86400000), h=String(Math.floor((d%86400000)/3600000)).padStart(2,'0'), m=String(Math.floor((d%3600000)/60000)).padStart(2,'0'), s=String(Math.floor((d%60000)/1000)).padStart(2,'0'); document.getElementById('countdown-display').innerHTML=`${days} DAYS<br><span class="text-xl">${h}:${m}:${s}</span>`; }
        
        function openStatusMenu(){
            haptic(10); const content=document.getElementById('modal-content'); document.getElementById('modal-title').innerText="PHYSICAL STATUS";
            content.innerHTML=`<div class="flex flex-col gap-3"><button onclick="recStatus('🟢 Great')" class="bg-slate-900 border border-green-500 p-4 rounded-xl text-green-400 font-bold">Great</button><button onclick="recStatus('🟡 Okay')" class="bg-slate-900 border border-yellow-500 p-4 rounded-xl text-yellow-400 font-bold">Okay</button><button onclick="recStatus('🔴 Exhausted')" class="bg-slate-900 border border-red-500 p-4 rounded-xl text-red-400 font-bold">Exhausted</button></div>`;
            document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').classList.add('flex');
        }
        function recStatus(s){ haptic(15); addTimelineHistory(`Status: ${s}`,getCurrentTime(),getCurrentTime(),'---','info'); closeModal(); }

        window.onload = () => {
            initFundSelect(); setInterval(()=>{updateCountdown(); if(isInPark)updateCooldownDisplay();},1000);
            const saved=localStorage.getItem('extremeDisneyData');
            if(saved){
                const d=JSON.parse(saved); history=d.history||[]; costHistory=d.costHistory||[]; totalCost=d.totalCost||0; budget=d.budget||30000; dailyMemo=d.dailyMemo||""; isInPark=d.isInPark||false; targetDateStr=d.targetDateStr||"2026-06-01T08:00:00"; targetFund=d.targetFund||100000; currentFund=d.currentFund||0; preParkTweets=d.preParkTweets||[];
                if(d.dpaCooldownTime)dpaCooldownTime=new Date(d.dpaCooldownTime); if(d.ppCooldownTime)ppCooldownTime=new Date(d.ppCooldownTime);
                applyModeUI(); updatePreParkFundDisplay(); renderTweets(); renderTimeline(); updateCostDisplay();
            } else { applyModeUI(); }
        };
    </script>
</body>
</html>
