<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>EXTREME Disney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --deep-space: #020617; --panel-bg: rgba(15, 23, 42, 0.95); }
        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--deep-space) 100%);
            color: #e0faff; font-family: 'Noto Sans JP', sans-serif;
            margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        
        /* テキストシャドウ定義 */
        .text-shadow-cyan { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .text-shadow-yellow { text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        .text-shadow-red { text-shadow: 0 0 10px rgba(248, 113, 113, 0.8); }
        
        main { flex: 0 0 auto; }
        
        #timeline-wrapper { 
            flex: 1 1 auto; 
            height: 380px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        #timeline-wrapper::-webkit-scrollbar { display: none; }

        .rect-btn {
            height: 54px; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 4px 10px; line-height: 1.3; font-weight: bold; gap: 2px;
        }

        .category-icon { width: 22px; height: 22px; margin-bottom: 2px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        
        .cost-display-bar {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 12px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
        }

        input[type="text"], input[type="number"], input[type="time"], textarea {
            font-size: 16px !important;
        }

        @keyframes pulse-slow { 0%, 100% { border-color: rgba(0,242,255,0.2); } 50% { border-color: rgba(0,242,255,1); } }
        .recording-active { animation: pulse-slow 2s infinite; border-width: 2px; }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30">
        <div>
            <h1 class="tomorrow-font text-base text-shadow-cyan tracking-widest font-bold italic text-cyan-300">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font uppercase mt-0.5">Sector: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400 uppercase">Reset</button>
            <button onclick="openDataModal()" class="px-2 py-2 rounded-lg border border-cyan-700 bg-cyan-950/40 text-[8px] tomorrow-font text-cyan-100 uppercase">Data</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-cyan-400 text-[9px] font-bold tomorrow-font bg-cyan-900/50 text-cyan-100 uppercase">In Park</button>
        </div>
    </header>

    <div id="recording-overlay" class="mx-4 mt-2 hidden relative z-50">
        <div class="glass-panel neon-border rounded-2xl p-4 flex flex-col gap-3 recording-active">
            <div class="flex justify-between items-center w-full">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-ping"></div>
                    <div class="max-w-[150px]">
                        <h3 id="active-name" class="font-bold text-xs truncate uppercase">---</h3>
                        <p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p>
                    </div>
                </div>
                <button onclick="stopRecording()" class="bg-red-600 text-white font-bold py-2 px-6 rounded-xl text-sm uppercase shadow-[0_0_15px_rgba(220,38,38,0.5)]">Finish</button>
            </div>
            
            <div id="live-cost-input-area" class="hidden flex gap-2 w-full pt-3 border-t border-slate-700 items-center">
                <input type="number" id="live-item-cost" placeholder="Cost (¥)" class="flex-1 bg-slate-900 border border-slate-700 py-2 px-3 rounded-xl text-base tomorrow-font outline-none focus:border-cyan-400 text-white tracking-widest">
                <button onclick="saveLiveCost()" id="live-cost-save-btn" class="bg-yellow-500 text-black font-bold py-2 px-6 rounded-xl text-sm uppercase tomorrow-font min-w-[90px]">Save</button>
            </div>
        </div>
    </div>

    <main class="p-4 space-y-3">
        <div class="space-y-2">
            <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
                <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all bg-cyan-500 text-black uppercase tracking-widest">Land</button>
                <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all text-slate-400 uppercase tracking-widest">Sea</button>
            </div>
            <div class="cost-display-bar py-3 relative overflow-hidden" onclick="openCostHistory()">
                <div id="budget-progress" class="absolute left-0 top-0 bottom-0 bg-cyan-500/30 w-0 transition-all duration-500"></div>
                <div class="relative z-10 flex justify-between w-full items-center px-2">
                    <div class="flex flex-col">
                        <span class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.2em] font-bold" id="budget-label">BUDGET: ¥30,000</span>
                        <span class="tomorrow-font text-[9px] text-slate-400 tracking-widest mt-0.5">TOTAL EXPENSES</span>
                    </div>
                    <span id="cost-display-value" class="tomorrow-font text-xl text-cyan-300 font-bold text-shadow-cyan">¥0</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <button onclick="openCategory('attraction')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Attr</span>
            </button>
            <button onclick="openCategory('show')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Show</span>
            </button>
            <button onclick="openCategory('greeting')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Greet</span>
            </button>
            <button onclick="openCategory('dpa')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M12 2v20m10-10H2"></path></svg>
                <span class="tomorrow-font text-[9px] text-red-400 font-bold uppercase tracking-wider">Dpa</span>
            </button>
            <button onclick="openCategory('food')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Food</span>
            </button>
            <button onclick="openCategory('shop')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Shop</span>
            </button>
            <button onclick="openCategory('rest')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
                <span class="tomorrow-font text-[9px] text-cyan-400 uppercase tracking-wider">Rest</span>
            </button>
            <button onclick="openCalculator()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon mb-1"><path d="M12 1v22M17 5H7M17 19H7M17 12H7"></path></svg>
                <span class="tomorrow-font text-[9px] text-yellow-400 uppercase tracking-wider">Cost</span>
            </button>
        </div>
    </main>

    <div id="timeline-wrapper" class="border-t border-cyan-500/20 glass-panel rounded-t-[2rem]">
        <div class="flex justify-between items-center px-6 pt-6 pb-4 sticky top-0 bg-slate-950/90 backdrop-blur-xl z-10 rounded-t-[2rem] border-b border-cyan-900/30">
            <h2 class="tomorrow-font text-xs text-cyan-400 tracking-[0.3em] font-bold uppercase">Mission Timeline</h2>
            <span id="log-count" class="text-xs text-slate-500 tomorrow-font uppercase tracking-widest">0 Logged</span>
        </div>
        <div id="timeline-list" class="space-y-2 pb-10 px-4 pt-2">
            <div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col items-center justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modal-container" class="glass-panel neon-border w-full rounded-t-[2.5rem] p-6 relative z-[110] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="tomorrow-font text-cyan-400 font-bold tracking-widest text-xs uppercase">Select target</h2>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-lg">×</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

        function haptic(pattern = 15) {
            if (navigator.vibrate) navigator.vibrate(pattern);

        function saveData() {
            const data = { history, costHistory, totalCost, budget };
            localStorage.setItem('extremeDisneyData', JSON.stringify(data));
        }

        // コスト表示と予算ゲージの更新関数（背景のコントラストをハッキリと）
        function updateCostDisplay() {
            const ratio = budget > 0 ? totalCost / budget : 0;
            const progressEl = document.getElementById('budget-progress');
            const valueEl = document.getElementById('cost-display-value');
            const labelEl = document.getElementById('budget-label');
            
            labelEl.innerText = `BUDGET: ¥${budget.toLocaleString()}`;
            valueEl.innerText = `¥${totalCost.toLocaleString()}`;
            
            let percent = Math.min(ratio * 100, 100);
            progressEl.style.width = `${percent}%`;
            
            if (ratio >= 1.0) {
                // 赤色：100%超過
                progressEl.className = "absolute left-0 top-0 bottom-0 bg-red-600/50 w-full transition-all duration-500";
                valueEl.className = "tomorrow-font text-xl text-red-400 font-bold text-shadow-red animate-pulse";
                labelEl.className = "tomorrow-font text-[10px] text-red-500 tracking-[0.2em] font-bold";
            } else if (ratio >= 0.8) {
                // 黄色：80%以上
                progressEl.className = "absolute left-0 top-0 bottom-0 bg-yellow-500/40 transition-all duration-500";
                valueEl.className = "tomorrow-font text-xl text-yellow-400 font-bold text-shadow-yellow";
                labelEl.className = "tomorrow-font text-[10px] text-yellow-500 tracking-[0.2em] font-bold";
            } else {
                // シアン：通常（背景が黒寄りなので明るいトーンを使用）
                progressEl.className = "absolute left-0 top-0 bottom-0 bg-cyan-500/40 transition-all duration-500";
                valueEl.className = "tomorrow-font text-xl text-cyan-300 font-bold text-shadow-cyan";
                labelEl.className = "tomorrow-font text-[10px] text-cyan-400 tracking-[0.2em] font-bold";
            }
        }

        function getCurrentTime() {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function switchPark(park) {
            haptic(10);
            currentPark = park;
            const isTDL = park === 'TDL';
            document.getElementById('btn-TDL').className = `flex-1 py-3 rounded-lg text-xs font-bold transition-all ${isTDL?'bg-cyan-500 text-black':'text-slate-400'} uppercase tracking-widest`;
            document.getElementById('btn-TDS').className = `flex-1 py-3 rounded-lg text-xs font-bold transition-all ${!isTDL?'bg-cyan-500 text-black':'text-slate-400'} uppercase tracking-widest`;
            document.getElementById('current-park-display').innerText = `SECTOR: ${park}`;
        }

        function toggleParkInOut() {
            haptic([15, 40, 15]);
            const timeStr = getCurrentTime();
            isInPark = !isInPark;
            const btn = document.getElementById('park-status-btn');
            if (isInPark) {
                btn.innerText = "OUT PARK";
                btn.classList.add('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.remove('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimelineHistory(`インパーク (${currentPark})`, timeStr, timeStr, '---', 'info');
            } else {
                btn.innerText = "IN PARK";
                btn.classList.remove('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.add('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimelineHistory(`アウトパーク (${currentPark})`, timeStr, timeStr, '---', 'info');
            }
        }

        function openCategory(type) {
            haptic(10);
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = `${type.toUpperCase()} SELECT`;
            content.innerHTML = '';
            
            const filtered = masterData.filter(d => d.park === currentPark && d.type === type);
            const groups = filtered.reduce((a, o) => { (a[o.area] = a[o.area] || []).push(o); return a; }, {});
            
            for (const area in groups) {
                const areaDiv = document.createElement('div');
                areaDiv.className = "mb-4";
                areaDiv.innerHTML = `<h3 class="text-[8px] font-bold text-slate-500 mb-2 tomorrow-font tracking-widest uppercase">>>> ${area}</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2";
                
                groups[area].forEach(spot => {
                    const btn = document.createElement('button');
                    btn.className = "glass-panel rounded-xl border border-slate-800 text-white active:bg-cyan-900 rect-btn";
                    btn.innerHTML = `<span>${spot.name}</span>${spot.price ? `<span class="text-[9px] text-yellow-400">¥${spot.price}</span>` : ''}`;
                    btn.onclick = () => { 
                        haptic(15);
                        closeModal();
                        if(spot.type === 'dpa') {
                            const timeStr = getCurrentTime();
                            addCost(spot.name, spot.price, timeStr);
                            addTimelineHistory(`購入: ${spot.name}`, timeStr, timeStr, `¥${spot.price}`, 'cost');
                        } else {
                            startRecording(spot);
                        }
                    };
                    grid.appendChild(btn);
                });
                areaDiv.appendChild(grid);
                content.appendChild(areaDiv);
            }
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        function addTimelineHistory(name, start, end, duration, status, startTimeObj = null) {
            const newLog = {
                id: Date.now() + Math.random(),
                name: name,
                start: start,
                end: end,
                duration: duration,
                memo: '',
                status: status,
                startTimeObj: startTimeObj,
                type: currentRecord ? currentRecord.type : null,
                savedCost: null
            };
            history.push(newLog);
            saveData();
            renderTimeline(true);
            return newLog;
        }

        function startRecording(spot) {
            haptic(20);
            if (currentRecord) stopRecording();
            
            const startTimeObj = new Date();
            const timeStr = getCurrentTime();
            
            currentRecord = { ...spot, startTimeObj: startTimeObj };
            
            document.getElementById('active-name').innerText = spot.name;
            document.getElementById('recording-overlay').classList.remove('hidden');
            
            const liveArea = document.getElementById('live-cost-input-area');
            if(spot.type === 'shop' || spot.type === 'food') {
                liveArea.classList.remove('hidden');
                liveArea.classList.add('flex');
                
                const costInput = document.getElementById('live-item-cost');
                costInput.value = '';
                costInput.disabled = false;
                
                const saveBtn = document.getElementById('live-cost-save-btn');
                saveBtn.innerText = 'Save';
                saveBtn.disabled = false;
                saveBtn.classList.remove('bg-slate-600', 'text-slate-400');
                saveBtn.classList.add('bg-yellow-500', 'text-black');
                
                costInput.focus();
            } else {
                liveArea.classList.remove('flex');
                liveArea.classList.add('hidden');
            }

            currentRecord.tlRef = addTimelineHistory(spot.name, timeStr, '---', '00:00:00', 'active', startTimeObj);
            currentRecord.tlRef.type = spot.type;
            
            if(timerId) clearInterval(timerId);
            timerId = setInterval(updateActiveTimer, 1000);
            updateActiveTimer();
        }

        function saveLiveCost() {
            haptic(15);
            if(!currentRecord || (currentRecord.type !== 'shop' && currentRecord.type !== 'food')) return;
            
            const costInput = document.getElementById('live-item-cost');
            const iCost = parseInt(costInput.value);
            
            if(iCost > 0) {
                const timeStr = getCurrentTime();
                addCost(currentRecord.name, iCost, timeStr);
                
                currentRecord.savedCost = iCost;
                
                const saveBtn = document.getElementById('live-cost-save-btn');
                saveBtn.innerText = 'Saved';
                saveBtn.disabled = true;
                saveBtn.classList.replace('bg-yellow-500', 'bg-slate-600');
                saveBtn.classList.replace('text-black', 'text-slate-400');
                costInput.disabled = true;
            }
        }

        function updateActiveTimer() {
            if(!currentRecord) return;
            const diff = Math.floor((new Date() - currentRecord.startTimeObj) / 1000);
            const h = String(Math.floor(diff/3600)).padStart(2, '0');
            const m = String(Math.floor((diff%3600)/60)).padStart(2, '0');
            const s = String(diff%60).padStart(2, '0');
            let formatted = `${h}:${m}:${s}`;
            
            if(currentRecord.savedCost) {
                formatted += ` / ¥${currentRecord.savedCost}`;
            }
            
            document.getElementById('active-timer').innerText = formatted;
            
            const tlDuration = document.getElementById(`duration-${currentRecord.tlRef.id}`);
            if(tlDuration) tlDuration.innerText = formatted;
        }

        function stopRecording() {
            haptic(30);
            if (!currentRecord) return;
            
            const endObj = new Date();
            const diff = Math.floor((endObj - currentRecord.startTimeObj) / 1000);
            let durStr = `${Math.floor(diff/60)}m ${diff%60}s`;
            const startStr = currentRecord.tlRef.start;
            
            if(currentRecord.type === 'shop' || currentRecord.type === 'food') {
                if(!currentRecord.savedCost) {
                    const costInput = document.getElementById('live-item-cost');
                    if(costInput && !costInput.disabled) {
                        const iCost = parseInt(costInput.value);
                        if(iCost > 0) {
                            addCost(currentRecord.name, iCost, startStr);
                            currentRecord.savedCost = iCost;
                        }
                    }
                }
                if(currentRecord.savedCost) {
                    durStr = `${durStr} / ¥${currentRecord.savedCost}`;
                }
            }

            currentRecord.tlRef.end = getCurrentTime();
            currentRecord.tlRef.duration = durStr;
            currentRecord.tlRef.status = 'finished';
            
            const costInput = document.getElementById('live-item-cost');
            if(costInput) {
                 costInput.disabled = false;
                 costInput.value = '';
            }
            const saveBtn = document.getElementById('live-cost-save-btn');
            if(saveBtn) {
                 saveBtn.innerText = 'Save';
                 saveBtn.disabled = false;
                 saveBtn.classList.replace('bg-slate-600', 'bg-yellow-500');
                 saveBtn.classList.replace('text-slate-400', 'text-black');
            }

            saveData();
            clearInterval(timerId);
            currentRecord = null;
            document.getElementById('recording-overlay').classList.add('hidden');
            renderTimeline(false);
        }

        function renderTimeline(scrollToBottom = false) {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>';
                if(sortableTimeline) sortableTimeline.destroy();
                sortableTimeline = null;
            } else {
                history.forEach((h, index) => {
                    const isActive = h.status === 'active';
                    const isTimeRange = h.status === 'active' || h.status === 'finished';
                    const titleColor = isActive ? 'text-red-400 animate-pulse' : 'text-white';
                    
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-start glass-panel p-3 rounded-xl border-l-2 border-cyan-400 cursor-grab";
                    div.innerHTML = `
                        <div class="flex-1 pr-2">
                            <p class="text-base font-bold ${titleColor} tracking-wide">${h.name}</p>
                            <p class="tomorrow-font text-base text-slate-400 uppercase mt-1 cursor-pointer" onclick="openEditTimeModal(${index})">
                                T-MARK: <span class="text-cyan-300 underline underline-offset-2">${h.start}</span>
                                ${isTimeRange ? ` 〜 <span class="text-cyan-300 underline underline-offset-2">${h.end}</span>` : ''}
                                <span class="ml-1 text-cyan-600 text-sm">✎</span>
                            </p>
                            <input type="text" placeholder="Add memo..." value="${h.memo}" onchange="updateMemo(${index}, this.value)" class="bg-transparent border-b border-slate-700 tomorrow-font tracking-widest text-cyan-100 w-full mt-1.5 pb-0.5 outline-none focus:border-cyan-400 placeholder-slate-600" style="font-size: 10px !important;">
                        </div>
                        <div class="flex flex-col items-end gap-1 mt-0.5">
                            <button onclick="deleteLog(${index})" class="w-6 h-6 rounded bg-red-950/30 text-red-500 text-xs flex items-center justify-center">×</button>
                            <p class="tomorrow-font text-[9px] text-cyan-400 font-bold mt-1" id="duration-${h.id}">${h.duration}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });

                if(sortableTimeline) sortableTimeline.destroy();
                sortableTimeline = new Sortable(list, {
                    delay: 200,
                    delayOnTouchOnly: true,
                    animation: 150,
                    ghostClass: 'opacity-30',
                    onEnd: function (evt) {
                        haptic(15);
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        const movedItem = history.splice(oldIndex, 1)[0];
                        history.splice(newIndex, 0, movedItem);
                        saveData();
                        renderTimeline(false);
                    }
                });
            }
            
            document.getElementById('log-count').innerText = `${history.length} LOGS`;
            
            if(scrollToBottom) {
                setTimeout(() => {
                    const wrapper = document.getElementById('timeline-wrapper');
                    wrapper.scrollTo({ top: wrapper.scrollHeight, behavior: 'smooth' });
                }, 50);
            }
        }

        function updateMemo(index, val) {
            history[index].memo = val;
            saveData();
        }

        // --- 編集機能 (コスト修正対応版) ---
        function openEditTimeModal(index) {
            haptic(10);
            const log = history[index];
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EDIT LOG";
            
            let html = `<div class="space-y-4">`;
            
            html += `
                <div>
                    <label class="text-[10px] text-cyan-400 uppercase">Start Time</label>
                    <input id="edit-start" type="time" value="${log.start}" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white">
                </div>`;
            
            if (log.status === 'finished' || log.status === 'active') {
                html += `
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">End Time</label>
                        <input id="edit-end" type="time" value="${log.end === '---' ? '' : log.end}" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white">
                    </div>`;
            }
            
            let currentCost = '';
            if (log.duration.includes('¥')) {
                currentCost = log.duration.split('¥')[1].replace(/[^0-9]/g, '');
            }
            
            if (log.duration.includes('¥') || log.type === 'shop' || log.type === 'food' || log.status === 'cost') {
                html += `
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Cost (¥)</label>
                        <input id="edit-cost" type="number" value="${currentCost}" placeholder="0" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white tracking-widest">
                    </div>`;
            }
            
            html += `
                    <button onclick="saveEditedTime(${index})" class="w-full bg-cyan-500 text-black font-bold py-4 rounded-xl uppercase">Save Changes</button>
                </div>
            `;
            content.innerHTML = html;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        function saveEditedTime(index) {
            haptic(15);
            const log = history[index];
            const newStart = document.getElementById('edit-start').value;
            const oldStart = log.start;
            
            if(newStart) log.start = newStart;

            if (log.status === 'active') {
                const [hours, minutes] = newStart.split(':');
                const now = new Date();
                now.setHours(hours, minutes, 0, 0);
                log.startTimeObj = now;
                if(currentRecord && currentRecord.tlRef.id === log.id) {
                    currentRecord.startTimeObj = now;
                }
            } else if (log.status === 'finished') {
                const newEnd = document.getElementById('edit-end').value;
                if(newEnd) log.end = newEnd;
                
                if(log.start && log.end && log.start !== '---' && log.end !== '---') {
                    const [sH, sM] = log.start.split(':');
                    const [eH, eM] = log.end.split(':');
                    const sDate = new Date(); sDate.setHours(sH, sM, 0, 0);
                    const eDate = new Date(); eDate.setHours(eH, eM, 0, 0);
                    if(eDate < sDate) eDate.setDate(eDate.getDate() + 1);
                    
                    const diff = Math.floor((eDate - sDate) / 1000);
                    let costPart = '';
                    if(log.duration.includes(' / ¥')) {
                        costPart = ' / ¥' + log.duration.split(' / ¥')[1];
                    }
                    log.duration = `${Math.floor(diff/60)}m ${diff%60}s${costPart}`;
                }
            }

            const costInputEl = document.getElementById('edit-cost');
            if (costInputEl) {
                const newCost = parseInt(costInputEl.value) || 0;
                let oldCost = 0;
                if (log.duration.includes('¥')) {
                    oldCost = parseInt(log.duration.split('¥')[1].replace(/[^0-9]/g, '')) || 0;
                }

                if (oldCost !== newCost || (oldCost > 0 && newStart && newStart !== oldStart)) {
                    let searchName = log.name.replace('購入: ', '');
                    
                    if (oldCost > 0) {
                        let costIndex = costHistory.findIndex(c => c.time === oldStart && c.amount === oldCost);
                        if (costIndex !== -1) {
                            costHistory.splice(costIndex, 1);
                            totalCost -= oldCost;
                        }
                    }
                    if (newCost > 0) {
                        costHistory.push({ name: searchName, amount: newCost, time: newStart || log.start });
                        totalCost += newCost;
                    }
                    if (log.status === 'active' && currentRecord && currentRecord.tlRef.id === log.id) {
                        currentRecord.savedCost = newCost > 0 ? newCost : null;
                    }
                    if (log.status === 'cost') {
                        log.duration = newCost > 0 ? `¥${newCost}` : ''; 
                    } else {
                        let timePart = log.duration.split(' / ¥')[0];
                        log.duration = newCost > 0 ? `${timePart} / ¥${newCost}` : timePart;
                    }
                }
            }
            
            updateCostDisplay();
            saveData();
            renderTimeline(false);
            closeModal();
        }

        function deleteLog(i) { 
            haptic(20);
            if(confirm("DELETE THIS LOG?")) { 
                const log = history[i];
                if (log.status === 'cost' && log.duration.startsWith('¥')) {
                    const rawName = log.name.replace('購入: ', '');
                    const costIndex = costHistory.findIndex(c => c.name === rawName && c.time === log.start);
                    if (costIndex !== -1) {
                        totalCost -= costHistory[costIndex].amount;
                        costHistory.splice(costIndex, 1);
                        updateCostDisplay();
                    }
                }
                
                if (log.status === 'active') {
                    clearInterval(timerId);
                    currentRecord = null;
                    document.getElementById('recording-overlay').classList.add('hidden');
                }
                
                history.splice(i, 1); 
                saveData();
                renderTimeline(false); 
            } 
        }

        function resetAllLogs() { 
            haptic(20);
            if(confirm("RESET ALL LOGS AND COSTS?")) { 
                history=[]; costHistory=[]; totalCost=0; 
                updateCostDisplay();
                if(timerId) clearInterval(timerId);
                currentRecord = null;
                document.getElementById('recording-overlay').classList.add('hidden');
                saveData();
                renderTimeline(false); 
            } 
        }
        
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

        function openCalculator() {
            haptic(10);
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "COST ADD";
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Item</label>
                        <input id="calc-name" type="text" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm tomorrow-font outline-none focus:border-cyan-400 text-white tracking-widest">
                    </div>
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Cost (¥)</label>
                        <input id="calc-amount" type="number" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white tracking-widest">
                    </div>
                    <button onclick="addCostFromCalc()" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl uppercase">Add Expense</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            document.getElementById('calc-name').focus();
        }

        function addCostFromCalc() {
            haptic(15);
            const name = document.getElementById('calc-name').value || "Others";
            const amount = parseInt(document.getElementById('calc-amount').value) || 0;
            if(amount > 0) {
                const timeStr = getCurrentTime();
                addCost(name, amount, timeStr);
                addTimelineHistory(`購入: ${name}`, timeStr, timeStr, `¥${amount}`, 'cost');
            }
            closeModal();
        }

        function addCost(name, amount, timeStr) {
            costHistory.push({ name, amount, time: timeStr });
            totalCost += amount;
            updateCostDisplay();
            saveData();
        }

        function saveBudget() {
            haptic(15);
            const newBudget = parseInt(document.getElementById('budget-input').value) || 0;
            budget = newBudget;
            saveData();
            updateCostDisplay();
            closeModal(); // SETボタン押下時にポップアップを閉じる
        }

        function openCostHistory() {
            haptic(10);
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPENSE BREAKDOWN";
            let listHtml = costHistory.map((c, i) => `
                <div class="flex justify-between p-3 border-b border-slate-800 text-xs">
                    <span>${c.time} | ${c.name}</span>
                    <span class="text-yellow-400 font-bold">¥${c.amount.toLocaleString()}</span>
                </div>
            `).join('');
            
            content.innerHTML = `
                <div class="mb-4 bg-slate-900 p-3 rounded-xl border border-slate-700">
                    <label class="text-[9px] text-cyan-400 uppercase tracking-widest mb-1 block">Set Budget Limit (¥)</label>
                    <div class="flex gap-2">
                        <input id="budget-input" type="number" value="${budget}" class="flex-1 bg-slate-800 border border-slate-600 p-2 rounded-lg text-sm tomorrow-font outline-none focus:border-cyan-400 text-white tracking-widest">
                        <button onclick="saveBudget()" class="bg-cyan-700 text-cyan-100 px-4 rounded-lg text-[10px] tomorrow-font font-bold uppercase">Set</button>
                    </div>
                </div>
                <div class="space-y-1 mb-4 max-h-[35vh] overflow-y-auto">${listHtml || '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">No expenses</p></div>'}</div>
                <button onclick="copyCostLog()" class="w-full bg-cyan-500 text-black py-3 rounded-xl uppercase text-[10px] tomorrow-font font-bold">Copy Cost List</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        async function copyCostLog() {
            haptic(15);
            let text = costHistory.map(c => `${c.time} | ${c.name} : ¥${c.amount}`).join('\n') + `\n------------------\nTOTAL: ¥${totalCost} / LIMIT: ¥${budget}`;
            await navigator.clipboard.writeText(text); alert("Cost list copied!");
        }

        function openDataModal() {
            haptic(10);
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "DATA MANAGEMENT";
            
            content.innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h3 class="text-[10px] text-cyan-400 font-bold mb-2">TEXT EXPORT (FOR NOTES)</h3>
                        <button onclick="copyTextLog()" class="w-full bg-cyan-900 text-cyan-100 py-3 rounded-xl text-[10px] tomorrow-font border border-cyan-500 font-bold">Copy Text Log</button>
                    </div>
                    <div class="border-t border-slate-700 pt-4">
                        <h3 class="text-[10px] text-cyan-400 font-bold mb-2">SYSTEM BACKUP (JSON)</h3>
                        <textarea id="json-data-area" rows="5" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-[9px] font-mono text-cyan-100 outline-none focus:border-cyan-400" placeholder="Paste JSON data here to import..."></textarea>
                        <div class="flex gap-2 mt-3">
                            <button onclick="generateJson()" class="flex-1 bg-slate-700 text-white py-3 rounded-xl text-[10px] tomorrow-font font-bold">Generate JSON</button>
                            <button onclick="importJson()" class="flex-1 bg-red-900/80 text-red-100 py-3 rounded-xl text-[10px] tomorrow-font border border-red-500 font-bold">Import JSON</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        async function copyTextLog() {
            haptic(15);
            let logText = history.map(h => {
                const timeRange = (h.status === 'active' || h.status === 'finished') ? `${h.start}〜${h.end}` : h.start;
                const memoText = h.memo ? `\n  └ Memo: ${h.memo}` : '';
                return `${timeRange} | ${h.name} (${h.duration})${memoText}`;
            }).join('\n');
            
            let costText = costHistory.map(c => `${c.time} | ${c.name} : ¥${c.amount}`).join('\n');
            logText += `\n\n--- COST BREAKDOWN ---\n${costText}\nTOTAL: ¥${totalCost} / LIMIT: ¥${budget}`;
            
            await navigator.clipboard.writeText(logText); 
            alert("Text Log Copied!"); 
        }

        async function generateJson() {
            haptic(15);
            const data = { history, costHistory, totalCost, budget };
            const jsonStr = JSON.stringify(data);
            document.getElementById('json-data-area').value = jsonStr;
            await navigator.clipboard.writeText(jsonStr);
            alert("JSON Generated & Copied to clipboard!");
        }

        function importJson() {
            haptic(15);
            const jsonStr = document.getElementById('json-data-area').value;
            if(!jsonStr) { alert("Please paste JSON data first."); return; }
            try {
                const data = JSON.parse(jsonStr);
                if(data.history && data.costHistory) {
                    if(confirm("Current data will be overwritten. Proceed?")) {
                        history = data.history;
                        history.forEach(h => {
                            if(h.startTimeObj) h.startTimeObj = new Date(h.startTimeObj);
                        });
                        costHistory = data.costHistory;
                        totalCost = data.totalCost || 0;
                        budget = data.budget || 30000;
                        updateCostDisplay();
                        
                        const activeLog = history.find(h => h.status === 'active');
                        if(activeLog) {
                            currentRecord = { name: activeLog.name, startTimeObj: activeLog.startTimeObj, tlRef: activeLog, type: activeLog.type, savedCost: activeLog.savedCost };
                            document.getElementById('active-name').innerText = activeLog.name;
                            document.getElementById('recording-overlay').classList.remove('hidden');
                            
                            const liveArea = document.getElementById('live-cost-input-area');
                            if(activeLog.type === 'shop' || activeLog.type === 'food') {
                                liveArea.classList.remove('hidden');
                                liveArea.classList.add('flex');
                                
                                const costInput = document.getElementById('live-item-cost');
                                const saveBtn = document.getElementById('live-cost-save-btn');
                                
                                if(activeLog.duration.includes(' / ¥')) {
                                    currentRecord.savedCost = parseInt(activeLog.duration.split(' / ¥')[1]);
                                }

                                if(currentRecord.savedCost) {
                                    costInput.value = currentRecord.savedCost;
                                    costInput.disabled = true;
                                    saveBtn.innerText = 'SAVED';
                                    saveBtn.disabled = true;
                                    saveBtn.classList.replace('bg-yellow-500', 'bg-slate-600');
                                    saveBtn.classList.replace('text-black', 'text-slate-400');
                                } else {
                                    costInput.value = '';
                                    costInput.disabled = false;
                                    saveBtn.innerText = 'SAVE';
                                    saveBtn.disabled = false;
                                    saveBtn.classList.replace('bg-slate-600', 'bg-yellow-500');
                                    saveBtn.classList.replace('text-slate-400', 'text-black');
                                }
                            } else {
                                liveArea.classList.remove('flex');
                                liveArea.classList.add('hidden');
                            }
                            
                            if(timerId) clearInterval(timerId);
                            timerId = setInterval(updateActiveTimer, 1000);
                            updateActiveTimer();
                        }
                        
                        saveData();
                        renderTimeline(false);
                        alert("Import Successful!");
                        closeModal();
                    }
                } else {
                    alert("Invalid JSON format.");
                }
            } catch(e) {
                alert("Failed to parse JSON.");
            }
        }

        window.onload = () => {
            updateCostDisplay(); 
            const savedData = localStorage.getItem('extremeDisneyData');
            if(savedData) {
                try {
                    const data = JSON.parse(savedData);
                    if(data.history && data.costHistory) {
                        history = data.history;
                        history.forEach(h => {
                            if(h.startTimeObj) h.startTimeObj = new Date(h.startTimeObj);
                        });
                        costHistory = data.costHistory;
                        totalCost = data.totalCost || 0;
                        budget = data.budget || 30000;
                        updateCostDisplay();
                        
                        const activeLog = history.find(h => h.status === 'active');
                        if(activeLog) {
                            currentRecord = { name: activeLog.name, startTimeObj: activeLog.startTimeObj, tlRef: activeLog, type: activeLog.type };
                            
                            if(activeLog.duration.includes(' / ¥')) {
                                currentRecord.savedCost = parseInt(activeLog.duration.split(' / ¥')[1]);
                            }

                            document.getElementById('active-name').innerText = activeLog.name;
                            document.getElementById('recording-overlay').classList.remove('hidden');
                            
                            const liveArea = document.getElementById('live-cost-input-area');
                            if(activeLog.type === 'shop' || activeLog.type === 'food') {
                                liveArea.classList.remove('hidden');
                                liveArea.classList.add('flex');
                                
                                const costInput = document.getElementById('live-item-cost');
                                const saveBtn = document.getElementById('live-cost-save-btn');
                                
                                if(currentRecord.savedCost) {
                                    costInput.value = currentRecord.savedCost;
                                    costInput.disabled = true;
                                    saveBtn.innerText = 'SAVED';
                                    saveBtn.disabled = true;
                                    saveBtn.classList.replace('bg-yellow-500', 'bg-slate-600');
                                    saveBtn.classList.replace('text-black', 'text-slate-400');
                                } else {
                                    costInput.value = '';
                                    costInput.disabled = false;
                                    saveBtn.innerText = 'SAVE';
                                    saveBtn.disabled = false;
                                    saveBtn.classList.replace('bg-slate-600', 'bg-yellow-500');
                                    saveBtn.classList.replace('text-slate-400', 'text-black');
                                }
                            } else {
                                liveArea.classList.remove('flex');
                                liveArea.classList.add('hidden');
                            }
                            
                            if(timerId) clearInterval(timerId);
                            timerId = setInterval(updateActiveTimer, 1000);
                            updateActiveTimer();
                        }
                        renderTimeline(false);
                    }
                } catch(e) {
                    console.error("Failed to load data.", e);
                }
            }
        };
    </script>
