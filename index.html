<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>EXTREME Disney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --deep-space: #020617; --panel-bg: rgba(15, 23, 42, 0.95); }
        body {
            background-color: var(--deep-space);
            background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--deep-space) 100%);
            color: #e0faff; font-family: 'Noto Sans JP', sans-serif;
            margin: 0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top);
        }
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        .neon-text { text-shadow: 0 0 10px var(--neon-blue); }
        
        main { flex: 0 0 auto; }
        
        /* タイムライン：約7行分に固定（380px前後） */
        #timeline-wrapper { 
            flex: 1 1 auto; 
            height: 380px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        #timeline-wrapper::-webkit-scrollbar { display: none; }

        /* サブカテゴリボタンを長方形に */
        .rect-btn {
            height: 54px; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 4px 10px; line-height: 1.3; font-weight: bold; gap: 2px;
        }

        .category-icon { width: 22px; height: 22px; margin-bottom: 2px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        
        .cost-display-bar {
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 12px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
        }

        /* iOSの入力ズーム対策 */
        input[type="text"], input[type="number"] {
            font-size: 16px !important;
        }

        @keyframes pulse-slow { 0%, 100% { border-color: rgba(0,242,255,0.2); } 50% { border-color: rgba(0,242,255,1); } }
        .recording-active { animation: pulse-slow 2s infinite; border-width: 2px; }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30">
        <div>
            <h1 class="tomorrow-font text-base neon-text tracking-widest font-bold italic">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font uppercase">Sector: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400 uppercase">Reset</button>
            <button onclick="openExportModal()" class="px-2 py-2 rounded-lg border border-cyan-700 bg-cyan-950/40 text-[8px] tomorrow-font uppercase">Export</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-cyan-400 text-[9px] font-bold tomorrow-font bg-cyan-900/50 uppercase">In Park</button>
        </div>
    </header>

    <div id="recording-overlay" class="mx-4 mt-2 hidden">
        <div class="glass-panel neon-border rounded-2xl p-4 flex justify-between items-center recording-active">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-red-500 animate-ping"></div>
                <div class="max-w-[150px]">
                    <h3 id="active-name" class="font-bold text-xs truncate uppercase">---</h3>
                    <p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p>
                </div>
            </div>
            <button onclick="stopRecording(false)" class="bg-cyan-500 text-black font-bold py-2 px-6 rounded-xl text-sm">FINISH</button>
        </div>
    </div>

    <main class="p-4 space-y-3">
        <div class="space-y-2">
            <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
                <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all bg-cyan-500 text-black uppercase">Land</button>
                <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-2 rounded-lg text-[10px] font-bold transition-all text-slate-400 uppercase">Sea</button>
            </div>
            <div class="cost-display-bar" onclick="openCostHistory()">
                <span class="tomorrow-font text-[9px] text-yellow-500 tracking-widest font-bold">TOTAL EXPENSES</span>
                <span id="cost-display-value" class="tomorrow-font text-base text-yellow-400 neon-text font-bold">¥0</span>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2">
            <button onclick="openCategory('attraction')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">

                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Attr</span>
            </button>
            <button onclick="openCategory('show')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Show</span>
            </button>
            <button onclick="openCategory('greeting')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Greet</span>
            </button>
            <button onclick="openCategory('dpa')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 2v20m10-10H2"></path></svg>
                <span class="tomorrow-font text-[7px] text-red-400 font-bold uppercase">Dpa</span>
            </button>
            <button onclick="openCategory('food')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Food</span>
            </button>
            <button onclick="openCategory('shop')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Shop</span>
            </button>
            <button onclick="openCategory('rest')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M3 12h18M3 6h18M3 18h18"></path></svg>
                <span class="tomorrow-font text-[7px] text-cyan-400 uppercase">Rest</span>
            </button>
            <button onclick="openCalculator()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30">
                <svg class="category-icon"><path d="M12 1v22M17 5H7M17 19H7M17 12H7"></path></svg>
                <span class="tomorrow-font text-[7px] text-yellow-400 uppercase">Cost</span>
            </button>
        </div>
    </main>

    <div id="timeline-wrapper" class="px-4 border-t border-cyan-500/20 glass-panel rounded-t-[2rem]">

            <h2 class="tomorrow-font text-[9px] text-cyan-400 tracking-[0.3em] font-bold uppercase">Mission Timeline</h2>
            <span id="log-count" class="text-[9px] text-slate-500 tomorrow-font uppercase tracking-widest">0 Logged</span>
        </div>
        <div id="timeline-list" class="space-y-2 pb-10">
            <div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col items-center justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>

            </div>
            <div id="modal-content"></div>

    </div>

        let currentPark = 'TDL';

        // GPS
        let userPos = { lat: 35.632, lng: 139.884 };
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                userPos.lat = p.coords.latitude;
                userPos.lng = p.coords.longitude;
                if (currentRecord && currentRecord.lat) {
                    if (getDist(userPos.lat, userPos.lng, currentRecord.lat, currentRecord.lng) > 200) {
                        stopRecording(true);
                    }
                }
            }, err => console.log(err), { enableHighAccuracy: true });

        // 現在時刻をHH:MM形式で取得
        function getCurrentTime() {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function switchPark(park) {
            currentPark = park;
            const isTDL = park === 'TDL';
            document.getElementById('btn-TDL').className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition-all ${isTDL?'bg-cyan-500 text-black':'text-slate-400'} uppercase`;
            document.getElementById('btn-TDS').className = `flex-1 py-2 rounded-lg text-[10px] font-bold transition-all ${!isTDL?'bg-cyan-500 text-black':'text-slate-400'} uppercase`;
            document.getElementById('current-park-display').innerText = `SECTOR: ${park}`;
        }

        function toggleParkInOut() {
            const timeStr = getCurrentTime();
            isInPark = !isInPark;
            const btn = document.getElementById('park-status-btn');
            if (isInPark) {
                btn.innerText = "OUT PARK";
                btn.classList.add('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.remove('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimelineHistory(`インパーク (${currentPark})`, timeStr, timeStr, '---', 'info');
            } else {
                btn.innerText = "IN PARK";
                btn.classList.remove('bg-red-900/40', 'border-red-500', 'text-red-400');
                btn.classList.add('bg-cyan-900/50', 'border-cyan-400', 'text-cyan-400');
                addTimelineHistory(`アウトパーク (${currentPark})`, timeStr, timeStr, '---', 'info');
            }
        }

        function openCategory(type) {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = `${type.toUpperCase()} SELECT`;
            content.innerHTML = '';
            
            // GPS Suggestion
            const suggestions = masterData
                .filter(d => d.park === currentPark && d.type === type && d.lat)
                .map(d => ({ ...d, dist: getDist(userPos.lat, userPos.lng, d.lat, d.lng) }))
                .sort((a, b) => a.dist - b.dist).slice(0, 3);

            if(suggestions.length > 0) {
                const head = document.createElement('div');
                head.className = "mb-6";
                head.innerHTML = `<h3 class="text-[8px] font-bold text-cyan-400 mb-2 tomorrow-font tracking-widest uppercase">>>> NEARBY SUGGESTION</h3>`;
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 gap-2";
                suggestions.forEach(spot => {
                    const btn = document.createElement('button');
                    btn.className = "glass-panel rounded-xl border border-cyan-400 text-white active:bg-cyan-900 rect-btn relative overflow-hidden";
                    btn.innerHTML = `<span>${spot.name}</span>${spot.price ? `<span class="text-[9px] text-yellow-400">¥${spot.price}</span>` : `<span class="text-[8px] text-cyan-300 font-normal">${Math.round(spot.dist)}m</span>`}`;
                    btn.onclick = () => { 
                        if(spot.type === 'dpa') {
                            const timeStr = getCurrentTime();
                            addCost(spot.name, spot.price, timeStr);
                            addTimelineHistory(`購入: ${spot.name}`, timeStr, timeStr, `¥${spot.price}`, 'cost');
                        } else {
                            startRecording(spot);
                        }
                        closeModal(); 
                    };
                    grid.appendChild(btn);
                });
                head.appendChild(grid);
                content.appendChild(head);
            }
            
            const filtered = masterData.filter(d => d.park === currentPark && d.type === type);
            const groups = filtered.reduce((a, o) => { (a[o.area] = a[o.area] || []).push(o); return a; }, {});
            
            for (const area in groups) {
                const areaDiv = document.createElement('div');

                            const timeStr = getCurrentTime();
                            addCost(spot.name, spot.price, timeStr);

                            startRecording(spot);

        // 共通：タイムライン配列へのPush関数
        function addTimelineHistory(name, start, end, duration, status, startTimeObj = null, lat = null, lng = null) {
            const newLog = {
                id: Date.now() + Math.random(), // Unique ID
                name: name,
                start: start,
                end: end,
                duration: duration,
                memo: '',
                status: status, // 'active', 'finished', 'cost', 'info'
                startTimeObj: startTimeObj,
                lat: lat,
                lng: lng
            };
            history.push(newLog);
            renderTimeline();
            return newLog;
        }

        function startRecording(spot) {
            if (currentRecord) stopRecording(false);
            
            const startTimeObj = new Date();
            const timeStr = getCurrentTime();
            
            // タイムラインに「進行中」として登録
            currentRecord = addTimelineHistory(spot.name, timeStr, '---', '00:00:00', 'active', startTimeObj, spot.lat, spot.lng);
            
            document.getElementById('active-name').innerText = spot.name;
            document.getElementById('recording-overlay').classList.remove('hidden');
            
            if(timerId) clearInterval(timerId);
            timerId = setInterval(updateActiveTimer, 1000);
            updateActiveTimer();
        }

        function updateActiveTimer() {
            if(!currentRecord) return;
            const diff = Math.floor((new Date() - currentRecord.startTimeObj) / 1000);
            const h = String(Math.floor(diff/3600)).padStart(2, '0');
            const m = String(Math.floor((diff%3600)/60)).padStart(2, '0');
            const s = String(diff%60).padStart(2, '0');
            const formatted = `${h}:${m}:${s}`;
            
            document.getElementById('active-timer').innerText = formatted;
            
            // タイムライン上の表示もリアルタイム更新
            const tlDuration = document.getElementById(`duration-${currentRecord.id}`);
            if(tlDuration) tlDuration.innerText = formatted;
        }

        function stopRecording(isAuto = false) {
            if (!currentRecord) return;
            const endObj = new Date();
            const diff = Math.floor((endObj - currentRecord.startTimeObj) / 1000);
            const durStr = `${Math.floor(diff/60)}m ${diff%60}s`;
            
            // 既存のレコードを更新
            currentRecord.end = getCurrentTime();
            currentRecord.duration = durStr;
            currentRecord.status = 'finished';
            if(isAuto) currentRecord.name += ' (AUTO)';
            
            clearInterval(timerId);
            currentRecord = null;
            document.getElementById('recording-overlay').classList.add('hidden');
            renderTimeline();
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';
            if (history.length === 0) {
                list.innerHTML = '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>';
            } else {
                history.forEach((h, index) => {
                    const isActive = h.status === 'active';
                    const isTimeRange = h.status === 'active' || h.status === 'finished';
                    const titleColor = isActive ? 'text-red-400 animate-pulse' : 'text-white';
                    
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-start glass-panel p-3 rounded-xl border-l-2 border-cyan-400";
                    div.innerHTML = `
                        <div class="flex-1 pr-2">
                            <p class="text-[10px] font-bold ${titleColor}">${h.name}</p>
                            <p class="tomorrow-font text-[7px] text-slate-400 uppercase mt-1 cursor-pointer" onclick="openEditTimeModal(${index})">
                                T-MARK: <span class="text-cyan-300 underline underline-offset-2">${h.start}</span>
                                ${isTimeRange ? ` 〜 <span class="text-cyan-300 underline underline-offset-2">${h.end}</span>` : ''}
                                <span class="ml-1 text-cyan-600 text-[10px]">✎</span>
                            </p>
                            <input type="text" placeholder="Add memo..." value="${h.memo}" onchange="updateMemo(${index}, this.value)" class="bg-transparent border-b border-slate-700 text-[9px] text-cyan-100 w-full mt-1.5 pb-0.5 outline-none focus:border-cyan-400 placeholder-slate-600">
                        </div>
                        <div class="flex flex-col items-end gap-1 mt-0.5">
                            <button onclick="deleteLog(${index})" class="w-6 h-6 rounded bg-red-950/30 text-red-500 text-xs flex items-center justify-center">×</button>
                            <p class="tomorrow-font text-[9px] text-cyan-400 font-bold mt-1" id="duration-${h.id}">${h.duration}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
            document.getElementById('log-count').innerText = `${history.length} LOGS`;
            document.getElementById('timeline-wrapper').scrollTo({ top: 9999, behavior: 'smooth' });
        }

        // --- メモ更新 ---
        function updateMemo(index, val) {
            history[index].memo = val;
        }

        // --- ログの時刻編集機能 ---
        function openEditTimeModal(index) {
            const log = history[index];
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EDIT LOG TIME";
            
            let html = `
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Start Time</label>
                        <input id="edit-start" type="time" value="${log.start}" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white">
                    </div>`;
            
            if (log.status === 'finished') {
                html += `
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">End Time</label>
                        <input id="edit-end" type="time" value="${log.end}" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white">
                    </div>`;
            }
            
            html += `
                    <button onclick="saveEditedTime(${index})" class="w-full bg-cyan-500 text-black font-bold py-4 rounded-xl uppercase">Save Changes</button>
                </div>
            `;
            content.innerHTML = html;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        function saveEditedTime(index) {
            const log = history[index];
            const newStart = document.getElementById('edit-start').value;
            const oldStart = log.start;
            
            if(newStart) log.start = newStart;

            if (log.status === 'cost') {
                // コストの時刻同期
                if (log.duration.startsWith('¥')) {
                    const rawName = log.name.replace('購入: ', '');
                    const costObj = costHistory.find(c => c.name === rawName && c.time === oldStart);
                    if(costObj) costObj.time = newStart;
                }
            } else if (log.status === 'active') {
                // アクティブ中のスタート時間を変えたら内部タイマーの基準も変更する
                const [hours, minutes] = newStart.split(':');
                const now = new Date();
                now.setHours(hours, minutes, 0, 0);
                log.startTimeObj = now;
            } else if (log.status === 'finished') {
                // 終了済みの時間を変えたらDurationを再計算
                const newEnd = document.getElementById('edit-end').value;
                if(newEnd) log.end = newEnd;
                
                const [sH, sM] = log.start.split(':');
                const [eH, eM] = log.end.split(':');
                const sDate = new Date(); sDate.setHours(sH, sM, 0, 0);
                const eDate = new Date(); eDate.setHours(eH, eM, 0, 0);
                
                // 翌日を跨いだ場合の補正
                if(eDate < sDate) eDate.setDate(eDate.getDate() + 1);
                
                const diff = Math.floor((eDate - sDate) / 1000);
                log.duration = `${Math.floor(diff/60)}m ${diff%60}s`;
            }
            
            renderTimeline();
            closeModal();
        }

        function deleteLog(i) { 
            if(confirm("DELETE THIS LOG?")) { 
                const log = history[i];
                if (log.status === 'cost' && log.duration.startsWith('¥')) {
                    const rawName = log.name.replace('購入: ', '');
                    const costIndex = costHistory.findIndex(c => c.name === rawName && c.time === log.start);
                    if (costIndex !== -1) {
                        totalCost -= costHistory[costIndex].amount;
                        costHistory.splice(costIndex, 1);
                        document.getElementById('cost-display-value').innerText = `¥${totalCost.toLocaleString()}`;
                    }
                }
                
                // もし削除したのがアクティブ中の記録ならタイマーも停止する
                if (log.status === 'active') {
                    clearInterval(timerId);
                    currentRecord = null;
                    document.getElementById('recording-overlay').classList.add('hidden');
                }
                
                history.splice(i, 1); 
                renderTimeline(); 
            } 
        }

        function resetAllLogs() { 
            if(confirm("RESET ALL LOGS AND COSTS?")) { 
                history=[]; costHistory=[]; totalCost=0; 
                document.getElementById('cost-display-value').innerText="¥0"; 
                if(timerId) clearInterval(timerId);
                currentRecord = null;
                document.getElementById('recording-overlay').classList.add('hidden');
                renderTimeline(); 
            } 
        }
        function closeModal() { document.getElementById('modal-overlay').classList.add('hidden'); }

        // --- コスト手動計算機能 (オートフォーカス対応) ---
        function openCalculator() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "COST ADD";
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Item Name</label>
                        <input id="calc-name" type="text" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-sm outline-none focus:border-cyan-400 text-white">
                    </div>
                    <div>
                        <label class="text-[10px] text-cyan-400 uppercase">Amount (¥)</label>
                        <input id="calc-amount" type="number" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-lg tomorrow-font outline-none focus:border-cyan-400 text-white">
                    </div>
                    <button onclick="addCostFromCalc()" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl uppercase">Add Expense</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
            
            // iPhoneでのオートフォーカスとキーボード立ち上げ
            setTimeout(() => {
                document.getElementById('calc-name').focus();
            }, 100);
        }

        function addCostFromCalc() {
            const name = document.getElementById('calc-name').value || "Others";
            const amount = parseInt(document.getElementById('calc-amount').value) || 0;
            if(amount > 0) {
                const timeStr = getCurrentTime();
                addCost(name, amount, timeStr);
                addTimelineHistory(`購入: ${name}`, timeStr, timeStr, `¥${amount}`, 'cost');
            }
            closeModal();
        }

        function addCost(name, amount, timeStr) {
            costHistory.push({ name, amount, time: timeStr });
            totalCost += amount;
            document.getElementById('cost-display-value').innerText = `¥${totalCost.toLocaleString()}`;
        }

        function openCostHistory() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPENSE BREAKDOWN";
            let listHtml = costHistory.map((c, i) => `
                <div class="flex justify-between p-3 border-b border-slate-800 text-xs">
                    <span>${c.time} | ${c.name}</span>
                    <span class="text-yellow-400 font-bold">¥${c.amount.toLocaleString()}</span>
                </div>
            `).join('');
            content.innerHTML = `
                <div class="space-y-1 mb-4 max-h-[40vh] overflow-y-auto">${listHtml || '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">No expenses</p></div>'}</div>
                <button onclick="copyCostLog()" class="w-full bg-cyan-500 text-black py-3 rounded-xl uppercase text-[10px] tomorrow-font font-bold">Copy Cost List</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        async function copyCostLog() {
            let text = costHistory.map(c => `${c.time} | ${c.name} : ¥${c.amount}`).join('\n') + `\n------------------\nTOTAL: ¥${totalCost}`;
            await navigator.clipboard.writeText(text); alert("Cost list copied!");
        }

        // --- 全体書き出し (メモ反映) ---
        async function openExportModal() {
            const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = "EXPORT ALL";
            
            let logText = history.map(h => {
                const timeRange = (h.status === 'active' || h.status === 'finished') ? `${h.start}〜${h.end}` : h.start;
                const memoText = h.memo ? `\n  └ Memo: ${h.memo}` : '';
                return `${timeRange} | ${h.name} (${h.duration})${memoText}`;
            }).join('\n');
            
            let costText = costHistory.map(c => `${c.time} | ${c.name} : ¥${c.amount}`).join('\n');
            logText += `\n\n--- COST BREAKDOWN ---\n${costText}\nTOTAL: ¥${totalCost}`;
            
            content.innerHTML = `
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4 text-[9px] font-mono whitespace-pre-wrap max-h-[50vh] overflow-y-auto" id="raw-log-container"><span id="raw-log">${logText}</span></div>
                <button onclick="copyLog()" class="w-full bg-cyan-500 text-black py-3 rounded-xl uppercase tomorrow-font font-bold">Copy Clipboard</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('modal-overlay').classList.add('flex');
        }

        async function copyLog() { 
            const textToCopy = document.querySelector('#raw-log').innerText;
            await navigator.clipboard.writeText(textToCopy); 
            alert("Logs Copied!"); 
        }

        // 距離計算関数（ハバーシン公式）
        function getDist(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2-lat1)*Math.PI/180;
            const dLng = (lng2-lng1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

    </script>
</body>
