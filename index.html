<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    <title>EXTREME Disney</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --deep-space: #020617; --panel-bg: rgba(15, 23, 42, 0.95); }
        
        /* スクロール問題の解消：body自体をスクロールさせるネイティブな挙動に変更 */
        body { background-color: var(--deep-space); background-image: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--deep-space) 100%); color: #e0faff; font-family: 'Noto Sans JP', sans-serif; margin: 0; min-height: 100dvh; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); overflow-y: auto; overflow-x: hidden; }
        
        .tomorrow-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.15); }
        .neon-border { border: 1px solid var(--neon-blue); box-shadow: 0 0 15px rgba(0, 242, 255, 0.15); }
        .text-shadow-cyan { text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .text-shadow-yellow { text-shadow: 0 0 10px rgba(250, 204, 21, 0.5); }
        
        .rect-btn { height: 50px; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4px 6px; line-height: 1.2; font-weight: bold; gap: 2px; }
        .category-icon { width: 20px; height: 20px; margin-bottom: 2px; stroke: var(--neon-blue); fill: none; stroke-width: 1.5; }
        .cost-display-bar { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(0, 242, 255, 0.2); border-radius: 12px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
        input, select, textarea { font-size: 16px !important; max-width: 100%; box-sizing: border-box; }

        @keyframes pulse-slow { 0%, 100% { border-color: rgba(0,242,255,0.2); } 50% { border-color: rgba(0,242,255,1); } }
        .recording-active { animation: pulse-slow 2s infinite; border-width: 2px; }
    </style>
</head>
<body>

    <header class="p-4 glass-panel flex justify-between items-center border-b border-cyan-500/30 shrink-0 z-50 sticky top-0">
        <div>
            <h1 class="tomorrow-font text-base text-shadow-cyan tracking-widest font-bold italic text-cyan-300">EXTREME Disney</h1>
            <p id="current-park-display" class="text-[9px] text-cyan-500 tomorrow-font uppercase mt-0.5 opacity-0 transition-opacity">Sector: TDL</p>
        </div>
        <div class="flex gap-1">
            <button onclick="resetAllLogs()" class="px-2 py-2 rounded-lg border border-red-900 bg-red-950/40 text-[8px] tomorrow-font text-red-400 uppercase tracking-widest">Reset</button>
            <button onclick="openDataModal()" class="px-2 py-2 rounded-lg border border-indigo-500 bg-indigo-900/40 text-[8px] font-bold tomorrow-font text-indigo-300 uppercase tracking-widest">Data</button>
            <button id="park-status-btn" onclick="toggleParkInOut()" class="px-3 py-2 rounded-lg border border-blue-500 bg-blue-900/40 text-[9px] font-bold tomorrow-font text-blue-300 uppercase tracking-widest transition-colors">Pre-Park</button>
        </div>
    </header>

    <div id="pre-park-dashboard" class="p-4 space-y-5 pb-10 w-full flex-col flex">
        <div class="glass-panel p-5 rounded-2xl relative border-t-2 border-t-cyan-500 shadow-[0_0_20px_rgba(0,242,255,0.1)]">
            <button onclick="openPreParkSettings()" class="absolute top-3 right-3 text-cyan-600 text-lg">⚙️</button>
            <h2 class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.3em] font-bold uppercase mb-3 text-center">Mission Start</h2>
            <div id="countdown-display" class="tomorrow-font text-3xl text-cyan-300 text-shadow-cyan text-center font-bold tracking-widest leading-none">-- DAYS<br><span class="text-xl">--:--:--</span></div>
            <div id="target-date-display" class="text-center text-[9px] text-slate-500 mt-3 tomorrow-font tracking-widest uppercase">TARGET: ---</div>
        </div>

        <div class="glass-panel p-4 rounded-2xl border-l-2 border-l-yellow-500">
            <div class="flex justify-between items-center mb-1">
                <h2 class="tomorrow-font text-[10px] text-yellow-500 tracking-[0.2em] font-bold uppercase">Mission Fund</h2>
                <button onclick="openFundHistoryModal()" class="text-slate-400 text-[10px] px-2 py-1 bg-slate-800 rounded hover:bg-slate-700 active:text-yellow-500 uppercase font-bold tracking-widest">History</button>
            </div>
            <div class="flex justify-between items-end mb-2">
                <span id="fund-current" class="tomorrow-font text-2xl text-yellow-400 text-shadow-yellow font-bold leading-none">¥0</span>
                <span id="fund-target" class="tomorrow-font text-xs text-slate-400 tracking-widest">/ ¥0</span>
            </div>
            <div class="h-2 bg-slate-900 rounded-full overflow-hidden border border-slate-700 mb-4">
                <div id="fund-progress-bar" class="h-full bg-yellow-500 transition-all duration-700" style="width: 0%"></div>
            </div>
            <div class="flex gap-2">
                <select id="fund-input-amount" class="flex-[2] bg-slate-900/80 border border-slate-700 p-2 rounded-xl text-sm tomorrow-font text-white text-center appearance-none"></select>
                <button onclick="addFundFromInput()" class="flex-1 bg-yellow-600 text-black font-bold py-2 px-2 rounded-xl text-xs tomorrow-font uppercase tracking-widest">Add</button>
            </div>
        </div>

        <div>
            <h2 class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.2em] font-bold uppercase mb-2 ml-1">Preparation Log</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="tweet-input" placeholder="ワクワクするための準備..." class="flex-[3] bg-slate-900/80 border border-slate-700 py-2 px-3 rounded-xl text-sm text-white outline-none focus:border-cyan-400">
                <button onclick="postTweet()" class="flex-1 bg-cyan-600 text-black font-bold py-2 px-2 rounded-xl text-[10px] tomorrow-font uppercase">Post</button>
            </div>
            <div id="tweet-list" class="space-y-3"></div>
        </div>
    </div>

    <div id="in-park-dashboard" class="hidden flex-col w-full flex-1">
        
        <div id="cooldown-container" class="shrink-0 bg-slate-950/95 border-b border-cyan-900/50 p-2 z-40 hidden gap-3 shadow-lg sticky top-[72px]">
            <div id="dpa-timer-block" class="flex-1 glass-panel p-2 rounded-lg border-l-2 border-red-500 hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="tomorrow-font text-[9px] text-red-400 font-bold uppercase tracking-tighter flex items-center gap-1"><span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-ping"></span> DPA</span>
                    <span id="dpa-timer-text" class="tomorrow-font text-[11px] text-red-300 font-bold">--:--</span>
                </div>
                <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div id="dpa-timer-bar" class="h-full bg-red-500 transition-all" style="width: 0%"></div></div>
            </div>
            <div id="pp-timer-block" class="flex-1 glass-panel p-2 rounded-lg border-l-2 border-yellow-500 hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="tomorrow-font text-[9px] text-yellow-500 font-bold uppercase tracking-tighter flex items-center gap-1"><span class="w-1.5 h-1.5 bg-yellow-500 rounded-full animate-ping"></span> PP</span>
                    <span id="pp-timer-text" class="tomorrow-font text-[11px] text-yellow-300 font-bold">--:--</span>
                </div>
                <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden"><div id="pp-timer-bar" class="h-full bg-yellow-500 transition-all" style="width: 0%"></div></div>
            </div>
        </div>

        <div id="recording-overlay" class="mx-4 mt-4 hidden glass-panel neon-border rounded-2xl p-4 flex-col gap-3 recording-active z-30">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-ping"></div>
                    <div class="max-w-[150px]">
                        <h3 id="active-name" class="font-bold text-xs truncate uppercase">---</h3>
                        <p id="active-timer" class="tomorrow-font text-lg text-cyan-300">00:00:00</p>
                    </div>
                </div>
                <button onclick="stopRecording()" class="bg-red-600 text-white font-bold py-2 px-6 rounded-xl text-sm uppercase shadow-[0_0_15px_rgba(220,38,38,0.5)]">Finish</button>
            </div>
            <div id="live-cost-input-area" class="hidden gap-2 pt-3 border-t border-slate-700 items-center">
                <input type="number" id="live-item-cost" placeholder="Cost (¥)" class="flex-[3] bg-slate-900 border border-slate-700 py-2 px-3 rounded-xl text-base tomorrow-font outline-none focus:border-cyan-400 text-white">
                <button onclick="saveLiveCost()" id="live-cost-save-btn" class="flex-1 bg-yellow-500 text-black font-bold py-2 px-2 rounded-xl text-sm uppercase">Save</button>
            </div>
        </div>

        <main class="p-4 space-y-3">
            <div class="space-y-2">
                <div class="flex p-1 rounded-xl bg-slate-900/80 border border-slate-800">
                    <button onclick="switchPark('TDL')" id="btn-TDL" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all bg-cyan-500 text-black uppercase tracking-widest">Land</button>
                    <button onclick="switchPark('TDS')" id="btn-TDS" class="flex-1 py-3 rounded-lg text-xs font-bold transition-all text-slate-400 uppercase tracking-widest">Sea</button>
                </div>
                <div class="cost-display-bar py-3 relative overflow-hidden cursor-pointer" onclick="openCostHistory()">

                    <div class="relative z-10 flex justify-between w-full items-center px-2">
                        <div class="flex flex-col">
                            <span class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.2em] font-bold" id="budget-label">BUDGET: ¥30,000</span>
                            <span class="tomorrow-font text-[9px] text-slate-400 tracking-widest mt-0.5">TOTAL EXPENSES</span>
                        </div>

                    </div>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2">

                <button onclick="openCategory('food')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30"><svg class="category-icon"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg><span class="tomorrow-font text-[8px] text-cyan-400 uppercase">Food</span></button>
                <button onclick="openCategory('shop')" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30"><svg class="category-icon"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18"></path></svg><span class="tomorrow-font text-[8px] text-cyan-400 uppercase">Shop</span></button>

                <button onclick="openCalculator()" class="glass-panel p-2 rounded-xl border border-slate-800 flex flex-col items-center active:bg-cyan-900/30"><svg class="category-icon"><path d="M12 1v22M17 5H7M17 19H7M17 12H7"></path></svg><span class="tomorrow-font text-[8px] text-yellow-400 font-bold uppercase">Cost</span></button>
            </div>
            
            <button onclick="openStatusMenu()" class="w-full glass-panel p-3 rounded-xl border border-slate-800 flex justify-center items-center gap-2 active:bg-cyan-900/30 bg-slate-800/40">
                <svg class="w-5 h-5 stroke-green-400 fill-none" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                <span class="tomorrow-font text-[10px] text-green-400 font-bold uppercase tracking-widest">Physical Status</span>
            </button>

            <div class="glass-panel p-3 rounded-xl border border-slate-800 cursor-pointer active:bg-cyan-900/30" onclick="openDailyMemoModal()">
                <div class="flex justify-between items-center mb-2">
                    <span class="tomorrow-font text-[10px] text-cyan-400 tracking-[0.2em] font-bold uppercase">Mission Notes</span>
                    <span class="text-cyan-600 text-sm">✎</span>
                </div>
                <div id="daily-memo-display" class="text-xs text-cyan-100 whitespace-pre-wrap min-h-[20px]"><span class="text-slate-500 italic">Tap to add notes...</span></div>
            </div>
        </main>

        <div id="timeline-wrapper" class="border-t border-cyan-500/20 glass-panel rounded-t-[2rem] w-full flex-1">
            <div onclick="openFullTimeline()" class="shrink-0 cursor-pointer active:bg-slate-900/50 flex justify-between items-center px-6 pt-6 pb-4 sticky top-0 bg-slate-950/95 backdrop-blur-xl z-10 rounded-t-[2rem] border-b border-cyan-900/30">

                <span id="log-count" class="text-[10px] text-slate-500 tomorrow-font uppercase">0 Logged</span>
            </div>
            <div id="timeline-list" class="space-y-2 pb-24 px-4 pt-2 w-full">
                <div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-xl z-[100] hidden flex-col justify-end">
        <div class="absolute inset-0" onclick="closeModal()"></div>
        <div id="modal-container" class="glass-panel neon-border w-full rounded-t-[2.5rem] p-6 relative z-[110] max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="tomorrow-font text-cyan-400 font-bold tracking-widest text-xs uppercase">SELECT</h2>
                <button onclick="closeModal()" class="text-2xl w-8 h-8 flex items-center justify-center bg-slate-800 rounded-full pb-1">×</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

        // ==========================================
        // 2. グローバル変数 & 初期化
        // ==========================================
        let currentPark='TDL', currentRecord=null, timerId=null, history=[], costHistory=[], totalCost=0, budget=30000, dailyMemo="", isInPark=false;
        let targetDateStr="2026-06-01T08:00:00", targetFund=100000, currentFund=0, fundHistory=[], preParkTweets=[];
        let dpaCooldownTime=null, ppCooldownTime=null, sortableTimeline=null;

        const haptic = p => navigator.vibrate && navigator.vibrate(p);
        const getCurrentTime = () => { const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
        
        function saveData(){
            localStorage.setItem('extremeDisneyData', JSON.stringify({
                history, costHistory, totalCost, budget, dailyMemo, isInPark, targetDateStr, targetFund, currentFund, fundHistory, preParkTweets,
                dpaCooldownTime: dpaCooldownTime ? dpaCooldownTime.getTime() : null,
                ppCooldownTime: ppCooldownTime ? ppCooldownTime.getTime() : null
            }));
        }

        // ==========================================
        // 3. メインモード切替 (Pre-Park <-> In-Park)
        // ==========================================
        function toggleParkInOut(){
            haptic([15,40,15]); isInPark = !isInPark; applyModeUI();
            addTimelineHistory(isInPark ? `インパーク (${currentPark})` : `アウトパーク (${currentPark})`, getCurrentTime(), getCurrentTime(), '---', 'info');
            saveData();
        }

        function applyModeUI(){
            const btn = document.getElementById('park-status-btn');
            document.getElementById('pre-park-dashboard').classList.toggle('hidden', isInPark);
            document.getElementById('in-park-dashboard').classList.toggle('hidden', !isInPark);
            document.getElementById('current-park-display').classList.toggle('opacity-0', !isInPark);
            btn.innerText = isInPark ? "OUT PARK" : "IN PARK";
            btn.className = `px-3 py-2 rounded-lg text-[9px] font-bold tomorrow-font uppercase tracking-widest transition-colors ${isInPark ? 'border-emerald-500 bg-emerald-900/40 text-emerald-400' : 'border-blue-500 bg-blue-900/40 text-blue-300'}`;
            if(isInPark) window.scrollTo(0,0);
        }

        // ==========================================
        // 4. パス・クールダウンロジック
        // ==========================================
        function startCooldown(type){
            const now = new Date();
            if(type === 'dpa') dpaCooldownTime = new Date(now.getTime() + 60 * 60000);
            if(type === 'pp')  ppCooldownTime = new Date(now.getTime() + 120 * 60000);
            saveData(); updateCooldownDisplay();
        }

        function updateCooldownDisplay(){
            const now = new Date(); let anyActive = false;
            const db = document.getElementById('dpa-timer-block'), pb = document.getElementById('pp-timer-block');
            
            if(dpaCooldownTime && dpaCooldownTime > now){
                anyActive = true; db.classList.remove('hidden'); const diff = dpaCooldownTime - now;
                document.getElementById('dpa-timer-text').innerText = `${Math.floor(diff/60000)}:${String(Math.floor((diff%60000)/1000)).padStart(2,'0')}`;
                document.getElementById('dpa-timer-bar').style.width = `${(diff/3600000)*100}%`;
            } else { db.classList.add('hidden'); dpaCooldownTime = null; }
            
            if(ppCooldownTime && ppCooldownTime > now){
                anyActive = true; pb.classList.remove('hidden'); const diff = ppCooldownTime - now;
                document.getElementById('pp-timer-text').innerText = `${Math.floor(diff/60000)}:${String(Math.floor((diff%60000)/1000)).padStart(2,'0')}`;
                document.getElementById('pp-timer-bar').style.width = `${(diff/7200000)*100}%`;
            } else { pb.classList.add('hidden'); ppCooldownTime = null; }
            
            document.getElementById('cooldown-container').classList.toggle('hidden', !anyActive);
        }

        function markPassUsed(id, type){
            haptic(30); const log = history.find(h => h.id === id);
            if(log){
                log.passUsed = true;
                if(type === 'dpa') dpaCooldownTime = null;
                if(type === 'pp') ppCooldownTime = null;
                saveData(); renderTimeline(); updateCooldownDisplay();
            }
        }

        // ==========================================
        // 5. モーダル / カテゴリー選択
        // ==========================================
        function openCategory(type){
            haptic(10); const content = document.getElementById('modal-content');
            document.getElementById('modal-title').innerText = type.toUpperCase(); content.innerHTML = '';
            const filtered = masterData.filter(d => d.park === currentPark && d.type === type);
            const groups = filtered.reduce((a, o) => { (a[o.area] = a[o.area] || []).push(o); return a; }, {});
            
            for(const area in groups){
                const div = document.createElement('div'); div.innerHTML = `<h3 class="text-[8px] text-slate-500 mb-2 font-bold uppercase tracking-widest">>>> ${area}</h3>`;
                const grid = document.createElement('div'); grid.className = "grid grid-cols-2 gap-2 mb-4 w-full";
                groups[area].forEach(spot => {
                    const held = spot.passType === 'dpa' && history.some(h => h.name.includes(spot.name) && !h.passUsed);
                    const btn = document.createElement('button');
                    btn.className = `glass-panel rounded-xl text-white rect-btn p-2 w-full ${held ? 'opacity-20 pointer-events-none' : 'active:bg-cyan-900'}`;
                    btn.innerHTML = `<span class="truncate w-full">${spot.name}</span>${spot.price ? `<span class="text-yellow-400 text-[9px] mt-1">¥${spot.price}</span>` : ''}`;
                    btn.onclick = () => {
                        closeModal(); haptic(15);
                        if(spot.passType){
                            const time = getCurrentTime();
                            const log = addTimelineHistory(`取得: ${spot.name}`, time, time, spot.price ? `¥${spot.price}` : '---', spot.price ? 'cost' : 'info');
                            log.passType = spot.passType; log.passUsed = false;
                            if(spot.price) addCost(spot.name, spot.price, time);
                            if(spot.passType === 'dpa' || spot.passType === 'pp') startCooldown(spot.passType);
                        } else { startRecording(spot); }
                    };
                    grid.appendChild(btn);
                });
                div.appendChild(grid); content.appendChild(div);
            }
            document.getElementById('modal-overlay').classList.remove('hidden'); document.getElementById('modal-overlay').classList.add('flex');
        }

        // ==========================================
        // 6. タイムライン機能
        // ==========================================
        function addTimelineHistory(name, start, end, duration, status){
            const log = { id: Date.now(), name, start, end, duration, status, memo: '', passType: null, passUsed: false };
            history.push(log); saveData(); renderTimeline(true); return log;
        }

        function renderTimeline(scroll = false){
            const list = document.getElementById('timeline-list'); list.innerHTML = '';
            if(history.length === 0){ list.innerHTML = '<div class="text-center py-10"><p class="text-[9px] text-slate-600 tomorrow-font tracking-widest italic uppercase">Waiting for input...</p></div>'; }
            history.forEach((h, i) => {
                const div = document.createElement('div'); div.className = "flex justify-between items-start glass-panel p-3 rounded-xl border-l-2 border-cyan-400 w-full";
                const isTimeRange = h.status === 'active' || h.status === 'finished';
                const usedBtn = (h.passType && (h.passType==='dpa'||h.passType==='pp') && !h.passUsed) 
                    ? `<button onclick="markPassUsed(${h.id},'${h.passType}')" class="mt-2 bg-cyan-900/50 border border-cyan-500 text-cyan-100 text-[8px] px-2 py-1 rounded font-bold uppercase active:bg-cyan-700 transition-colors">Mark as Used</button>` 
                    : (h.passUsed ? `<span class="mt-2 block text-[8px] text-slate-500 uppercase font-bold italic">Passed/Used</span>` : '');
                
                div.innerHTML = `
                    <div class="flex-[3] pr-2 min-w-0">
                        <p class="text-base font-bold ${h.status === 'active' ? 'text-red-400 animate-pulse' : 'text-white'} truncate">${h.name}</p>
                        <p class="tomorrow-font text-base text-slate-400 uppercase mt-1 cursor-pointer truncate" onclick="openEditTimeModal(${i})">
                            T-MARK: <span class="text-cyan-300 underline">${h.start}</span> ${isTimeRange ? `〜 <span class="text-cyan-300 underline">${h.end}</span>` : ''} <span class="ml-1 text-cyan-600 text-sm">✎</span>
                        </p>
                        ${usedBtn}
                        <input type="text" placeholder="Add memo..." value="${h.memo}" onchange="history[${i}].memo=this.value;saveData();" class="bg-transparent border-b border-slate-700 tomorrow-font tracking-widest text-cyan-100 w-full mt-1.5 pb-0.5 outline-none focus:border-cyan-400" style="font-size: 10px !important;">
                    </div>
                    <div class="flex-1 flex flex-col items-end gap-1 mt-0.5 min-w-[50px]">
                        <button onclick="deleteLog(${i})" class="w-6 h-6 rounded bg-red-950/30 text-red-500 text-xs flex items-center justify-center">×</button>
                        <p class="tomorrow-font text-sm text-cyan-400 font-bold mt-1 tracking-wider whitespace-nowrap text-right" id="duration-${h.id}">${h.duration}</p>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('log-count').innerText = `${history.length} LOGS`;
            if(sortableTimeline) sortableTimeline.destroy();

                    if(active.type==='shop'||active.type==='food'){
                        la.classList.remove('hidden'); la.classList.add('flex'); const btn=document.getElementById('live-cost-save-btn'), inp=document.getElementById('live-item-cost');
                        if(currentRecord.savedCost){ inp.value=currentRecord.savedCost; inp.disabled=true; btn.innerText='SAVED'; btn.disabled=true; btn.className='flex-1 bg-slate-600 text-slate-400 font-bold py-2 px-2 rounded-xl text-sm uppercase min-w-[70px]'; }
                        else{ inp.value=''; inp.disabled=false; btn.innerText='SAVE'; btn.disabled=false; btn.className='flex-1 bg-yellow-500 text-black font-bold py-2 px-2 rounded-xl text-sm uppercase min-w-[70px]'; }
                    }
                    timerId = setInterval(updateActiveTimer, 1000); updateActiveTimer();
                }
            } else { applyModeUI(); updateCostDisplay(); }
        };
    </script>
</body>
</html>
